<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Advisor Chat - Scheme App</title>
<!-- Tailwind CSS v3 with forms & container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#16a34a',
              600: '#0e793c',
              700: '#0d6532',
              800: '#0a4b26',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-scroll">
    /* Hide standard scrollbars for native app feel */
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen antialiased select-none font-sans">
<!-- BEGIN: MobileFrameContainer -->
<!-- Container replicating the iPhone viewport from screen 5 -->
<main class="w-full max-w-[393px] h-[852px] bg-slate-50 flex flex-col justify-between shadow-2xl relative overflow-hidden border border-gray-200 sm:rounded-[44px]">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full pt-3 px-7 flex justify-between items-center bg-white z-20 shrink-0">
<!-- Time -->
<span class="text-[15px] font-semibold tracking-tight text-gray-900">9:41</span>
<!-- iOS Icons (Cellular, Wifi, Battery) -->
<div class="flex items-center space-x-1.5 text-gray-900">
<!-- Cellular Bars -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="4" rx="0.5" width="2.5" x="0" y="8"></rect>
<rect height="6.5" rx="0.5" width="2.5" x="4.5" y="5.5"></rect>
<rect height="9" rx="0.5" width="2.5" x="9" y="3"></rect>
<rect height="11.5" rx="0.5" width="2.5" x="13.5" y="0.5"></rect>
</svg>
<!-- Wifi -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path clip-rule="evenodd" d="M8 2.2a9.6 9.6 0 0 1 6.55 2.58.75.75 0 0 1-.03 1.08l-1.07.98a.75.75 0 0 1-1.02-.02 6.5 6.5 0 0 0-8.86 0 .75.75 0 0 1-1.02.02l-1.07-.98a.75.75 0 0 1-.03-1.08A9.6 9.6 0 0 1 8 2.2Zm-3.8 5.67a5 5 0 0 1 7.6 0 .75.75 0 0 1-.06 1.05l-1.07.97a.75.75 0 0 1-1.04-.04 2.1 2.1 0 0 0-2.86 0 .75.75 0 0 1-1.04.04l-1.07-.97a.75.75 0 0 1-.06-1.05ZM8 10a1.2 1.2 0 1 0 0 2.4A1.2 1.2 0 0 0 8 10Z" fill-rule="evenodd"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-gray-900 rounded-sm p-[1px] flex items-center relative">
<div class="h-full w-3.5 bg-gray-900 rounded-[0.5px]"></div>
<div class="w-[1.5px] h-1 bg-gray-900 absolute -right-[2.5px] rounded-r-xs"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: TopAppBar -->
<!-- App Bar with Leaf Logo, Advisor Title, Live Status, Notification Bell, User Avatar -->
<section class="w-full bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between z-10 shrink-0" data-purpose="app-bar">
<div class="flex items-center space-x-2.5">
<!-- Scheme App Green Leaf Icon -->
<div class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center text-white shadow-sm">
<svg class="w-5 h-5 transform -rotate-12 fill-current" viewbox="0 0 24 24">
<path d="M21 3C11.5 3 4.5 9 4.5 17c0 2.2.9 4 2.5 5.2-.2-1.8.3-3.6 1.5-4.8 1.8-1.8 4.6-2.4 7-1.4-1.2-1-1.8-2.6-1.5-4.2.3-1.6 1.6-2.9 3.2-3.3 2.1-.5 4.3.4 5.3 2.2C22.7 7.7 22 4.5 21 3Z"></path>
</svg>
</div>
<!-- Title & Status Dot -->
<div class="flex items-center space-x-1.5">
<h1 class="text-[17px] font-bold text-gray-900 tracking-tight">Advisor</h1>
<span class="w-2 h-2 bg-emerald-500 rounded-full inline-block"></span>
</div>
</div>
<!-- Actions: Bell & User Avatar -->
<div class="flex items-center space-x-3">
<!-- Bell Icon -->
<button aria-label="Notifications" class="p-1 text-gray-700 hover:text-gray-900 focus:outline-none" type="button">
<svg class="w-5 h-5 stroke-[1.8] stroke-current fill-none" viewbox="0 0 24 24">
<path d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- User Avatar (Rohit Kumar) -->
<div class="w-8 h-8 rounded-full bg-orange-100 ring-2 ring-emerald-600/30 overflow-hidden flex items-center justify-center text-xs font-semibold text-orange-800">
<img alt="Rohit Kumar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCkzgtCoiRY1iYOt4QvdHLj2kRf9Ali1r8lpYjnc_vzKXrZJnu-RofAgyTcNZul-epNHqY_VmkhtBAsFVJodejzxHc_m_14zoUGZEGYKPjF57WRvC14dfOYTPZTx870j-FYIM7Xn4AJTI-YUGXQ2nvHqxOXtHsHGLTtzeVFb6lI78TstEb5BfDZcUHyXZ8iNLHxAIqyAMx8wIvEVuBSxW7glrN9tv6gU-zc3Q4j3JD-u9NuHPLfYGpU"/>
</div>
</div>
</section>
<!-- END: TopAppBar -->
<!-- BEGIN: ChatStreamArea -->
<!-- Scrollable Chat Stream containing message bubble and question prompt chips -->
<div class="flex-1 overflow-y-auto px-4 py-4 space-y-5" data-purpose="chat-stream">
<!-- Advisor Message with Bot Avatar Badge -->
<div class="flex items-start space-x-2.5 max-w-[85%]">
<!-- Advisor Avatar Icon -->
<div class="w-8 h-8 rounded-full bg-emerald-600 flex-shrink-0 flex items-center justify-center text-white shadow-sm mt-0.5">
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h2a5 5 0 0 1 5 5v1h1a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-1v1a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5v-1H3a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2h1v-1a5 5 0 0 1 5-5h2V5.73A2 2 0 0 1 10 4a2 2 0 0 1 2-2M7.5 13A1.5 1.5 0 0 0 6 14.5 1.5 1.5 0 0 0 7.5 16 1.5 1.5 0 0 0 9 14.5 1.5 1.5 0 0 0 7.5 13m9 0a1.5 1.5 0 0 0-1.5 1.5 1.5 1.5 0 0 0 1.5 1.5 1.5 1.5 0 0 0 1.5-1.5 1.5 1.5 0 0 0-1.5-1.5M9 18h6v-1.5H9V18Z"></path>
</svg>
</div>
<!-- Message Bubble Card -->
<div class="bg-brand-50/70 border border-emerald-100 rounded-2xl rounded-tl-sm p-3.5 shadow-sm text-gray-800">
<p class="text-[13.5px] leading-snug font-normal text-gray-800">
            Hello! I'm your AI Advisor. How can I help you today?
          </p>
<!-- Message Timestamp & Read Receipts -->
<div class="flex items-center justify-end space-x-1 mt-1.5 text-[10px] text-emerald-700/80">
<span>9:41 AM</span>
<!-- Double check tick -->
<svg class="w-3.5 h-3.5 fill-current text-emerald-600" viewbox="0 0 16 16">
<path d="M12.354 4.354a.5.5 0 0 0-.708-.708L5 10.293 2.354 7.646a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0l7-7zm-4 0a.5.5 0 0 0-.708-.708L2 9.293l.646.647 5-5z"></path>
</svg>
</div>
</div>
</div>
<!-- Suggested Prompts / Chips Section -->
<div class="pt-2 space-y-2">
<!-- Subtitle Prompt -->
<p class="text-[12.5px] font-medium text-gray-600 px-1">
          You can ask me things like:
        </p>
<!-- Suggestion List Stack -->
<div class="flex flex-col space-y-2">
<!-- Suggestion Chip 1 -->
<button class="w-full text-left bg-white hover:bg-emerald-50/50 border border-gray-200/90 hover:border-emerald-300 rounded-xl px-4 py-2.5 text-[13px] text-gray-700 shadow-[0_1px_2px_rgba(0,0,0,0.03)] transition-colors active:scale-[0.99]" type="button">
            I'm facing a problem with login
          </button>
<!-- Suggestion Chip 2 -->
<button class="w-full text-left bg-white hover:bg-emerald-50/50 border border-gray-200/90 hover:border-emerald-300 rounded-xl px-4 py-2.5 text-[13px] text-gray-700 shadow-[0_1px_2px_rgba(0,0,0,0.03)] transition-colors active:scale-[0.99]" type="button">
            How do I upload a document?
          </button>
<!-- Suggestion Chip 3 -->
<button class="w-full text-left bg-white hover:bg-emerald-50/50 border border-gray-200/90 hover:border-emerald-300 rounded-xl px-4 py-2.5 text-[13px] text-gray-700 shadow-[0_1px_2px_rgba(0,0,0,0.03)] transition-colors active:scale-[0.99]" type="button">
            I need help with a specific scheme
          </button>
<!-- Suggestion Chip 4 -->
<button class="w-full text-left bg-white hover:bg-emerald-50/50 border border-gray-200/90 hover:border-emerald-300 rounded-xl px-4 py-2.5 text-[13px] text-gray-700 shadow-[0_1px_2px_rgba(0,0,0,0.03)] transition-colors active:scale-[0.99]" type="button">
            How do I contact support?
          </button>
</div>
</div>
</div>
<!-- END: ChatStreamArea -->
<!-- BEGIN: BottomChatComposer -->
<!-- Message input pill, attachment icon, and green mic button -->
<div class="p-3 bg-white border-t border-gray-100 flex items-center space-x-2 shrink-0" data-purpose="chat-composer">
<div class="flex-1 bg-gray-50 border border-gray-200 rounded-full px-4 py-2 flex items-center justify-between">
<input class="w-full bg-transparent border-0 p-0 text-[13.5px] text-gray-800 placeholder-gray-400 focus:ring-0 focus:outline-none" placeholder="Type your message..." type="text"/>
<!-- Paperclip Attachment Button -->
<button aria-label="Attach file" class="text-gray-400 hover:text-gray-600 focus:outline-none pl-2" type="button">
<svg class="w-4 h-4 stroke-[2] stroke-current fill-none rotate-45" viewbox="0 0 24 24">
<path d="m18.375 12.739-7.693 7.693a4.5 4.5 0 0 1-6.364-6.364l10.94-10.94A3 3 0 1 1 19.5 7.373L8.552 18.32a1.5 1.5 0 0 1-2.122-2.122l8.904-8.905" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Microphone Send/Record Circle Button -->
<button aria-label="Voice input" class="w-10 h-10 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white flex items-center justify-center shrink-0 shadow-md active:scale-95 transition-transform" type="button">
<svg class="w-4 h-4 stroke-[2] stroke-current fill-none" viewbox="0 0 24 24">
<path d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-3-3 3 3 0 0 0-3 3v6a3 3 0 0 0 3 3Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- END: BottomChatComposer -->
<!-- BEGIN: PersistentBottomNavbar -->
<!-- 4-Tab Bottom Navigation Bar matching Scheme App design -->
<nav class="w-full bg-white border-t border-gray-200 px-4 pt-2 pb-6 flex justify-around items-center shrink-0" data-purpose="bottom-navigation">
<!-- Tab 1: Advisor (Active) -->
<a class="flex flex-col items-center group text-emerald-600 focus:outline-none" href="#advisor">
<div class="p-1">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path>
</svg>
</div>
<span class="text-[10px] font-semibold tracking-tight">Advisor</span>
</a>
<!-- Tab 2: Vault -->
<a class="flex flex-col items-center group text-gray-500 hover:text-gray-900 focus:outline-none" href="#vault">
<div class="p-1">
<svg class="w-5 h-5 stroke-[2] stroke-current fill-none" viewbox="0 0 24 24">
<path d="M20.25 14.15v4.25c0 1.094-.787 2.036-1.872 2.18-2.087.277-4.216.42-6.378.42s-4.291-.143-6.378-.42c-1.085-.144-1.872-1.086-1.872-2.18v-4.25m16.5 0a2.18 2.18 0 0 0 .75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 0 0-3.413-.387m4.5 8.006c-.194.165-.42.295-.673.38A23.978 23.978 0 0 1 12 15.75c-2.648 0-5.195-.429-7.577-1.22a2.016 2.016 0 0 1-.673-.38m0 0A2.18 2.18 0 0 1 3 12.489V8.706c0-1.081.768-2.015 1.837-2.175a48.111 48.111 0 0 1 3.413-.387m7.5 0V5.25A2.25 2.25 0 0 0 13.5 3h-3a2.25 2.25 0 0 0-2.25 2.25v.894m7.5 0a48.667 48.667 0 0 0-7.5 0M12 12.75h.008v.008H12v-.008Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[10px] font-medium tracking-tight">Vault</span>
</a>
<!-- Tab 3: Check -->
<a class="flex flex-col items-center group text-gray-500 hover:text-gray-900 focus:outline-none" href="#check">
<div class="p-1">
<svg class="w-5 h-5 stroke-[2] stroke-current fill-none" viewbox="0 0 24 24">
<path d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[10px] font-medium tracking-tight">Check</span>
</a>
<!-- Tab 4: Schemes -->
<a class="flex flex-col items-center group text-gray-500 hover:text-gray-900 focus:outline-none" href="#schemes">
<div class="p-1">
<svg class="w-5 h-5 stroke-[2] stroke-current fill-none" viewbox="0 0 24 24">
<path d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[10px] font-medium tracking-tight">Schemes</span>
</a>
</nav>
<!-- END: PersistentBottomNavbar -->
<!-- BEGIN: iOSHomeIndicator -->
<div class="absolute bottom-1.5 left-1/2 transform -translate-x-1/2 w-32 h-1 bg-gray-900/40 rounded-full pointer-events-none"></div>
<!-- END: iOSHomeIndicator -->
</main>
<!-- END: MobileFrameContainer -->
</body></html>
