<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Scheme App - Profile</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf7',
              100: '#dcfce9',
              600: '#16845f',
              700: '#0E6245',
              800: '#0c523a',
              900: '#0a422f',
            },
            surface: '#f8fafc',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-ios-base">
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      background-color: #f1f5f9;
    }
  </style>
</head>
<body class="font-sans antialiased text-slate-800 flex justify-center items-center min-h-screen p-0 sm:p-4">
<!-- BEGIN: MobileDeviceFrame -->
<div class="w-full max-w-[390px] h-[844px] bg-white sm:rounded-[44px] shadow-2xl border-0 sm:border-[8px] sm:border-slate-900 flex flex-col relative overflow-hidden" data-purpose="mobile-viewport">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full pt-3 px-7 pb-1 flex justify-between items-center text-slate-900 z-20 shrink-0 select-none" data-purpose="status-bar">
<!-- Time -->
<span class="text-[15px] font-semibold tracking-tight">9:41</span>
<!-- Dynamic Island / Top Notch Area indicator for sizing -->
<div class="w-24 h-4 rounded-full"></div>
<!-- System Icons -->
<div class="flex items-center space-x-1.5 text-slate-900">
<!-- Cellular Signal -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.23c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l.62-.62C7.93 20.26 9.88 21 12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.63-.56 3.13-1.5 4.34l-9.84-9.84C8.87 5.56 10.37 5 12 5zm-7 7c0-1.63.56-3.13 1.5-4.34l9.84 9.84C15.13 18.44 13.63 19 12 19c-3.87 0-7-3.13-7-7z" opacity="0"></path>
<rect height="5" rx="1" width="3" x="2" y="16"></rect>
<rect height="9" rx="1" width="3" x="7" y="12"></rect>
<rect height="13" rx="1" width="3" x="12" y="8"></rect>
<rect height="17" rx="1" width="3" x="17" y="4"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.51 0 6.74 1.34 9.21 3.55L12 19.34 2.79 11.05C5.26 8.84 8.49 7.5 12 7.5z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 border-[1.5px] border-slate-900 rounded-[4px] p-0.5 flex items-center relative">
<div class="w-3.5 h-full bg-slate-900 rounded-[1px]"></div>
<div class="absolute -right-1 w-0.5 h-1.5 bg-slate-900 rounded-r-sm"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: NavigationBar -->
<nav class="relative w-full px-5 py-3 flex items-center justify-between border-b border-slate-100 bg-white shrink-0" data-purpose="screen-header">
<!-- Back Chevron Button -->
<button aria-label="Go back" class="p-1.5 -ml-1.5 text-slate-700 hover:text-slate-900 active:scale-95 transition-transform" type="button">
<svg class="w-6 h-6 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<polyline points="15 18 9 12 15 6"></polyline>
</svg>
</button>
<!-- Screen Title -->
<h1 class="text-base font-bold text-slate-900 tracking-tight">Profile</h1>
<!-- Empty placeholder to ensure center alignment -->
<div aria-hidden="true" class="w-6"></div>
</nav>
<!-- END: NavigationBar -->
<!-- BEGIN: MainContentArea -->
<main class="flex-1 overflow-y-auto px-5 py-6" data-purpose="profile-scroll-area">
<!-- BEGIN: UserIdentitySection -->
<section class="flex flex-col items-center text-center mb-7" data-purpose="user-identity">
<!-- Profile Picture Container with Badge -->
<div class="relative mb-3">
<div class="w-24 h-24 rounded-full ring-4 ring-emerald-50 bg-[#e8f5e9] overflow-hidden flex items-center justify-center shadow-inner">
<!-- Stylized Citizen Avatar Placeholder -->
<svg class="w-20 h-20 text-[#0E6245]" fill="none" viewbox="0 0 100 100">
<!-- Traditional Turban / Headwear accent -->
<ellipse cx="50" cy="38" fill="#F8A435" rx="22" ry="18"></ellipse>
<ellipse cx="48" cy="32" fill="#E67E22" rx="19" ry="12"></ellipse>
<!-- Face -->
<ellipse cx="50" cy="46" fill="#E0A96D" rx="17" ry="19"></ellipse>
<!-- Facial Hair / Mustache -->
<path d="M38 52 C 45 56, 47 50, 50 54 C 53 50, 55 56, 62 52 C 58 58, 42 58, 38 52 Z" fill="#2C3E50"></path>
<!-- Kurta Clothes -->
<path d="M22 88 C 24 66, 36 62, 50 62 C 64 62, 76 66, 78 88 Z" fill="#0E6245"></path>
<path d="M47 62 L50 78 L53 62 Z" fill="#FFFFFF"></path>
</svg>
</div>
<!-- Edit Photo Badge Icon Button -->
<button aria-label="Change photo" class="absolute bottom-0 right-0 p-1.5 bg-[#0E6245] text-white rounded-full border-2 border-white shadow-md hover:bg-brand-800 transition active:scale-95" type="button">
<svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M12 20h9"></path>
<path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
</svg>
</button>
</div>
<!-- User Name with inline edit indicator -->
<h2 class="text-lg font-bold text-slate-900 tracking-tight flex items-center justify-center gap-1.5">
<span>Rohit Kumar</span>
</h2>
<!-- Subtitle Name / Secondary Handle with Pencil Icon -->
<div class="flex items-center justify-center gap-1.5 text-slate-400 mt-0.5">
<span class="text-xs font-medium text-slate-500">Rohit Kumar</span>
<svg class="w-3 h-3 stroke-current text-slate-400" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
<path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
</svg>
</div>
</section>
<!-- END: UserIdentitySection -->
<!-- BEGIN: ProfileNavigationOptions -->
<section class="space-y-3" data-purpose="profile-menu-list">
<!-- Item 1: Personal Information -->
<a class="flex items-center justify-between p-3.5 bg-white rounded-2xl border border-slate-200 hover:border-brand-700/40 hover:bg-brand-50/20 active:scale-[0.99] transition shadow-sm" href="#personal-info">
<div class="flex items-center space-x-3.5">
<!-- Icon Container -->
<div class="w-10 h-10 rounded-xl bg-emerald-50 text-[#0E6245] flex items-center justify-center shrink-0">
<svg class="w-5 h-5 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
<circle cx="12" cy="7" r="4"></circle>
</svg>
</div>
<!-- Text Content -->
<div class="text-left">
<h3 class="text-sm font-semibold text-slate-800 leading-tight">Personal Information</h3>
<p class="text-xs text-slate-400 mt-0.5 font-normal">Name, email, phone</p>
</div>
</div>
<!-- Chevron Right -->
<svg class="w-4 h-4 text-slate-400 stroke-current shrink-0" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</a>
<!-- Item 2: Linked Accounts -->
<a class="flex items-center justify-between p-3.5 bg-white rounded-2xl border border-slate-200 hover:border-brand-700/40 hover:bg-brand-50/20 active:scale-[0.99] transition shadow-sm" href="#linked-accounts">
<div class="flex items-center space-x-3.5">
<!-- Icon Container -->
<div class="w-10 h-10 rounded-xl bg-emerald-50 text-[#0E6245] flex items-center justify-center shrink-0">
<svg class="w-5 h-5 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
</svg>
</div>
<!-- Text Content -->
<div class="text-left">
<h3 class="text-sm font-semibold text-slate-800 leading-tight">Linked Accounts</h3>
<p class="text-xs text-slate-400 mt-0.5 font-normal">Google, phone, email</p>
</div>
</div>
<!-- Chevron Right -->
<svg class="w-4 h-4 text-slate-400 stroke-current shrink-0" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</a>
<!-- Item 3: Manage Documents -->
<a class="flex items-center justify-between p-3.5 bg-white rounded-2xl border border-slate-200 hover:border-brand-700/40 hover:bg-brand-50/20 active:scale-[0.99] transition shadow-sm" href="#manage-documents">
<div class="flex items-center space-x-3.5">
<!-- Icon Container -->
<div class="w-10 h-10 rounded-xl bg-emerald-50 text-[#0E6245] flex items-center justify-center shrink-0">
<svg class="w-5 h-5 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<rect height="16" rx="2" width="18" x="3" y="4"></rect>
<line x1="8" x2="8" y1="2" y2="6"></line>
<line x1="16" x2="16" y1="2" y2="6"></line>
<path d="M8 12h8"></path>
<path d="M8 16h5"></path>
</svg>
</div>
<!-- Text Content -->
<div class="text-left">
<h3 class="text-sm font-semibold text-slate-800 leading-tight">Manage Documents</h3>
<p class="text-xs text-slate-400 mt-0.5 font-normal">Go to your Vault</p>
</div>
</div>
<!-- Chevron Right -->
<svg class="w-4 h-4 text-slate-400 stroke-current shrink-0" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</a>
<!-- Item 4: Your Results -->
<a class="flex items-center justify-between p-3.5 bg-white rounded-2xl border border-slate-200 hover:border-brand-700/40 hover:bg-brand-50/20 active:scale-[0.99] transition shadow-sm" href="#your-results">
<div class="flex items-center space-x-3.5">
<!-- Icon Container -->
<div class="w-10 h-10 rounded-xl bg-emerald-50 text-[#0E6245] flex items-center justify-center shrink-0">
<svg class="w-5 h-5 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 11l3 3L22 4"></path>
<path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
</svg>
</div>
<!-- Text Content -->
<div class="text-left">
<h3 class="text-sm font-semibold text-slate-800 leading-tight">Your Results</h3>
<p class="text-xs text-slate-400 mt-0.5 font-normal">View eligibility history</p>
</div>
</div>
<!-- Chevron Right -->
<svg class="w-4 h-4 text-slate-400 stroke-current shrink-0" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<polyline points="9 18 15 12 9 6"></polyline>
</svg>
</a>
</section>
<!-- END: ProfileNavigationOptions -->
</main>
<!-- END: MainContentArea -->
<!-- BEGIN: iOSHomeIndicator -->
<footer class="w-full pb-2 pt-1 flex justify-center bg-white shrink-0" data-purpose="home-indicator">
<div class="w-36 h-1 bg-slate-900/20 rounded-full"></div>
</footer>
<!-- END: iOSHomeIndicator -->
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
