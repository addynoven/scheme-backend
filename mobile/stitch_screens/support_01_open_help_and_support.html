<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Scheme App - Open Help &amp; Support</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#15803d',
              600: '#16a34a',
              700: '#047857',
              800: '#065f46',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"SF Pro Display"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<style data-purpose="custom-shadows">
    .menu-shadow {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-0 sm:p-4 antialiased text-slate-800 selection:bg-emerald-100">
<!-- BEGIN: MobileDeviceFrame -->
<!-- Mimics iPhone viewport dimensions -->
<div class="relative w-full max-w-[390px] h-[844px] bg-slate-50 overflow-hidden flex flex-col justify-between shadow-2xl sm:rounded-[44px] border border-slate-200" data-purpose="mobile-container">
<!-- Dimmed Background Overlay Layer -->
<div aria-hidden="true" class="absolute inset-0 bg-black/10 z-10 pointer-events-none"></div>
<!-- BEGIN: TopContainer -->
<div class="w-full bg-white z-20 flex flex-col">
<!-- BEGIN: IOSStatusBar -->
<div class="w-full pt-3 px-7 pb-1 flex justify-between items-center text-[14px] font-semibold text-slate-900 select-none tracking-tight" data-purpose="status-bar">
<span class="font-semibold text-[15px]">9:41</span>
<div class="flex items-center space-x-2">
<!-- Cellular signal -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="4" rx="0.6" width="2.5" x="0.5" y="8"></rect>
<rect height="6.5" rx="0.6" width="2.5" x="5" y="5.5"></rect>
<rect height="9" rx="0.6" width="2.5" x="9.5" y="3"></rect>
<rect height="11.5" rx="0.6" width="2.5" x="14" y="0.5"></rect>
</svg>
<!-- Wifi -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path clip-rule="evenodd" d="M8 2.5a11.97 11.97 0 0 1 6.88 2.16.8.8 0 0 1 .1 1.13l-1.07 1.15a.8.8 0 0 1-1.12.06A8.8 8.8 0 0 0 8 5.1c-1.8 0-3.48.55-4.8 1.5a.8.8 0 0 1-1.11-.06L1.02 5.39a.8.8 0 0 1 .1-1.13A11.97 11.97 0 0 1 8 2.5Zm0 4.6a7.2 7.2 0 0 1 4.14 1.3.8.8 0 0 1 .13 1.12l-1.06 1.13a.8.8 0 0 1-1.13.06 4.02 4.02 0 0 0-4.16 0 .8.8 0 0 1-1.13-.06L3.73 9.52a.8.8 0 0 1 .13-1.12A7.2 7.2 0 0 1 8 7.1Zm0 4.5a1.4 1.4 0 1 1 0-2.8 1.4 1.4 0 0 1 0 2.8Z" fill-rule="evenodd"></path>
</svg>
<!-- Battery -->
<div class="flex items-center space-x-0.5">
<div class="w-5 h-2.5 border border-slate-900 rounded-[3px] p-0.5 flex items-center">
<div class="w-full h-full bg-slate-900 rounded-[1px]"></div>
</div>
<div class="w-0.5 h-1 bg-slate-900 rounded-r-sm"></div>
</div>
</div>
</div>
<!-- END: IOSStatusBar -->
<!-- BEGIN: NavigationBar -->
<nav class="px-5 py-2.5 flex items-center justify-between border-b border-slate-100 bg-white" data-purpose="app-header">
<!-- Logo & Title -->
<div class="flex items-center space-x-2.5">
<!-- Scheme App Leaf Icon -->
<div class="w-7 h-7 rounded-full bg-emerald-700 flex items-center justify-center text-white shadow-sm overflow-hidden">
<svg class="w-4 h-4 fill-current transform -rotate-12" viewbox="0 0 24 24">
<path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22l1-2.3A4.49 4.49 0 0 0 8 20C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z"></path>
</svg>
</div>
<span class="font-bold text-lg tracking-tight text-slate-800">Advisor</span>
</div>
<!-- Notification Bell & User Avatar Button -->
<div class="flex items-center space-x-3.5">
<!-- Notification Bell -->
<button aria-label="Notifications" class="relative text-slate-600 hover:text-slate-800 focus:outline-none">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full ring-2 ring-white"></span>
</button>
<!-- User Avatar (Active / Anchor) -->
<div class="w-8 h-8 rounded-full ring-2 ring-emerald-600 bg-amber-100 flex items-center justify-center overflow-hidden border border-white cursor-pointer shadow-sm" data-purpose="user-avatar-trigger">
<!-- Illustrated Avatar Rohit Kumar -->
<svg class="w-full h-full text-slate-700" fill="currentColor" viewbox="0 0 36 36">
<rect fill="#FDE68A" height="36" width="36"></rect>
<!-- Hair -->
<path d="M10 14c0-5 3.5-7 8-7s8 2 8 7c0 1-1 2-2 2h-12c-1 0-2-1-2-2z" fill="#1F2937"></path>
<!-- Face -->
<circle cx="18" cy="17" fill="#F87171" opacity="0.3" r="6"></circle>
<ellipse cx="18" cy="18" fill="#FBBF24" rx="5" ry="6"></ellipse>
<!-- Shirt -->
<path d="M7 36c0-5 5-9 11-9s11 4 11 9H7z" fill="#047857"></path>
</svg>
</div>
</div>
</nav>
<!-- END: NavigationBar -->
</div>
<!-- END: TopContainer -->
<!-- BEGIN: MainContentArea -->
<!-- Content underneath with dropdown active -->
<main class="relative flex-1 w-full px-4 pt-3 flex flex-col items-center">
<!-- BEGIN: ProfileDropdownMenu -->
<!-- Anchored Dropdown Card -->
<section class="w-full bg-white rounded-2xl menu-shadow border border-slate-100 p-4 z-30 transition-all" data-purpose="profile-dropdown-card">
<!-- User Profile Card -->
<div class="flex items-center space-x-3 pb-4 mb-3 border-b border-slate-100">
<div class="w-12 h-12 rounded-full bg-amber-100 flex-shrink-0 flex items-center justify-center overflow-hidden border border-slate-200">
<!-- Illustrated Avatar of Rohit Kumar -->
<svg class="w-full h-full text-slate-700" fill="currentColor" viewbox="0 0 36 36">
<rect fill="#FDE68A" height="36" width="36"></rect>
<path d="M10 14c0-5 3.5-7 8-7s8 2 8 7c0 1-1 2-2 2h-12c-1 0-2-1-2-2z" fill="#1F2937"></path>
<ellipse cx="18" cy="18" fill="#FBBF24" rx="5" ry="6"></ellipse>
<path d="M7 36c0-5 5-9 11-9s11 4 11 9H7z" fill="#047857"></path>
</svg>
</div>
<div class="flex flex-col overflow-hidden">
<h2 class="text-base font-bold text-slate-900 leading-tight">Rohit Kumar</h2>
<p class="text-xs text-slate-500 truncate mt-0.5">rohit@example.com</p>
</div>
</div>
<!-- Menu Action Items List -->
<div class="space-y-1.5 flex flex-col font-medium text-sm">
<!-- View Profile Option -->
<a class="flex items-center px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition-colors" data-purpose="menu-item-profile" href="#">
<!-- Person icon -->
<svg class="w-5 h-5 text-slate-600 mr-3" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<span>View Profile</span>
</a>
<!-- Settings Option -->
<a class="flex items-center px-3 py-2.5 rounded-xl text-slate-700 hover:bg-slate-50 transition-colors" data-purpose="menu-item-settings" href="#">
<!-- Gear icon -->
<svg class="w-5 h-5 text-slate-600 mr-3" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<circle cx="12" cy="12" r="3" stroke-width="1.8"></circle>
</svg>
<span>Settings</span>
</a>
<!-- Help & Support (Active / Highlighted Option) -->
<a class="flex items-center px-3 py-2.5 rounded-xl text-emerald-800 bg-emerald-50 border border-emerald-400 font-semibold transition-all shadow-sm" data-purpose="menu-item-help-support" href="#">
<!-- Question Circle icon -->
<div class="w-5 h-5 rounded-full border border-emerald-600 flex items-center justify-center mr-3 text-emerald-700 font-bold text-xs">
              ?
            </div>
<span>Help &amp; Support</span>
</a>
<!-- Logout Option -->
<a class="flex items-center px-3 py-2.5 rounded-xl text-rose-600 hover:bg-rose-50 transition-colors" data-purpose="menu-item-logout" href="#">
<!-- Logout icon -->
<svg class="w-5 h-5 text-rose-500 mr-3" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<span>Logout</span>
</a>
</div>
</section>
<!-- END: ProfileDropdownMenu -->
</main>
<!-- END: MainContentArea -->
<!-- BEGIN: BottomNavigation -->
<footer class="w-full bg-white border-t border-slate-200 z-20" data-purpose="tab-bar">
<div class="flex justify-around items-center pt-2 pb-1 px-2 text-[11px] font-medium text-slate-500">
<!-- Tab 1: Advisor (Active) -->
<button aria-current="page" class="flex flex-col items-center justify-center flex-1 py-1 text-emerald-700 font-semibold focus:outline-none">
<!-- Home / Advisor Icon -->
<div class="relative">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 20 20">
<path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
</svg>
</div>
<span class="mt-1">Advisor</span>
</button>
<!-- Tab 2: Vault -->
<button class="flex flex-col items-center justify-center flex-1 py-1 text-slate-500 hover:text-slate-800 focus:outline-none">
<!-- Briefcase / Safe / Vault Icon -->
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="mt-1">Vault</span>
</button>
<!-- Tab 3: Check -->
<button class="flex flex-col items-center justify-center flex-1 py-1 text-slate-500 hover:text-slate-800 focus:outline-none">
<!-- Check Circle Icon -->
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="mt-1">Check</span>
</button>
<!-- Tab 4: Schemes -->
<button class="flex flex-col items-center justify-center flex-1 py-1 text-slate-500 hover:text-slate-800 focus:outline-none">
<!-- Schemes / Grid Icon -->
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="mt-1">Schemes</span>
</button>
</div>
<!-- iOS Home Indicator -->
<div class="w-full flex justify-center pb-1.5 pt-1" data-purpose="home-indicator">
<div class="w-32 h-1 bg-slate-900 rounded-full"></div>
</div>
</footer>
<!-- END: BottomNavigation -->
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
