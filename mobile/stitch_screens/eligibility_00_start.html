<!DOCTYPE html>

<title>Scheme App - Check Eligibility</title>

              100: '#dcfce7',
              500: '#15803d',

            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif']

        }
      }

<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<body class="p-0 sm:p-6 antialiased text-slate-800">

<div class="mobile-frame mx-auto border border-slate-100" data-purpose="screen-0-container">

<div class="w-24 h-4 bg-slate-900 rounded-full mx-auto hidden xs:block"></div>

<div class="flex items-center space-x-1.5 text-slate-900">

<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">

</lineargradient>
<lineargradient id="sariGrad" x1="0%" x2="100%" y1="0%" y2="100%">

<stop offset="100%" stop-color="#c2410c"></stop>
</lineargradient>
<lineargradient id="skin" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#e0a97c"></stop>
<stop offset="100%" stop-color="#cc8956"></stop>
</lineargradient>
<lineargradient id="curvedBg" x1="0%" x2="0%" y1="0%" y2="100%">
<stop offset="0%" stop-color="#fef3c7"></stop>
<stop offset="100%" stop-color="#dcfce7"></stop>
</lineargradient>
</defs>

<path d="M22 35 C20 22, 58 18, 58 35 C58 45, 22 45, 22 35 Z" fill="#f59e0b"></path>
<circle cx="40" cy="27" fill="#fbbf24" r="8"></circle>

<!-- Ears -->
<circle cx="26" cy="50" fill="#cc8956" r="3"></circle>
<circle cx="54" cy="50" fill="#cc8956" r="3"></circle>
<!-- Moustache -->
<path d="M33 55 Q40 58 47 55 Q40 53 33 55" fill="#332115" stroke="#332115" stroke-linecap="round" stroke-width="1.5"></path>

<circle cx="35" cy="47" fill="#2d1c0b" r="1.5"></circle>
<circle cx="45" cy="47" fill="#2d1c0b" r="1.5"></circle>
<!-- Kurta & Shoulders -->
<path d="M20 70 C20 62, 28 62, 40 62 C52 62, 60 62, 60 70 L66 110 L14 110 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"></path>

<path d="M27 63 Q40 70 53 63 Q55 85 52 110 L45 110 Q42 85 40 73 Q38 85 35 110 L28 110 Z" fill="#fef08a" opacity="0.9"></path>

<ellipse cx="40" cy="32" fill="#1e293b" rx="16" ry="18"></ellipse>
<!-- Face -->

<!-- Hair front -->
<path d="M28 34 Q40 26 52 34 Q48 24 40 24 Q32 24 28 34" fill="#0f172a"></path>

<circle cx="44" cy="40" fill="#0f172a" r="1.5"></circle>
<path d="M37 47 Q40 50 43 47" fill="none" stroke="#683917" stroke-linecap="round" stroke-width="1.2"></path>

</g>
<!-- Right Character: Empowered Rural Woman -->

<!-- Face -->
<ellipse cx="40" cy="44" fill="url(#skin)" rx="12.5" ry="15"></ellipse>
<!-- Bindi -->
<circle cx="40" cy="38" fill="#991b1b" r="1.2"></circle>
<!-- Eyes & smile -->
<circle cx="36" cy="42" fill="#0f172a" r="1.5"></circle>
<circle cx="44" cy="42" fill="#0f172a" r="1.5"></circle>
<path d="M37 49 Q40 52 43 49" fill="none" stroke="#683917" stroke-linecap="round" stroke-width="1.2"></path>

<path d="M22 62 Q36 78 48 100" fill="none" stroke="#f59e0b" stroke-width="1.5"></path>
</g>

<path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"></path>

<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>

<span class="text-[14.5px] font-semibold text-slate-800 tracking-tight">Personalized results</span>

<path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>

<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[14.5px] font-semibold text-slate-800 tracking-tight">100% private &amp; secure</span>
</div>
</div>
<!-- END: ValuePropositions -->
</div>
<!-- BEGIN: CallToAction -->

<div class="pt-2 pb-1" data-purpose="cta-section">
<button class="w-full bg-[#0e6245] hover:bg-[#094530] active:scale-[0.99] transition-all text-white py-3.5 px-6 rounded-xl font-bold text-[15.5px] flex items-center justify-center space-x-2 shadow-sm shadow-emerald-950/20" type="button">
<span>Let's Get Started</span>
<svg class="w-4 h-4 text-white translate-y-[0.5px]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M5 12h14M12 5l7 7-7 7"></path>

</button>
</div>

</main>

<footer class="w-full pb-2 pt-1 flex justify-center shrink-0 select-none pointer-events-none" data-purpose="home-indicator">
