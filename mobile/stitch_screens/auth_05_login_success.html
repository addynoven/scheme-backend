<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Login Success - Scheme App</title>
<!-- Tailwind CSS v3 CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#16a34a',
              600: '#0d7a57',
              700: '#0b6649',
              800: '#064e3b',
              900: '#022c22',
            }
          }
        }
      }
    }
  </script>
<!-- Custom styles for subtle animations and background artwork -->
<style data-purpose="layout">
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-0 sm:p-4 selection:bg-brand-100">
<!-- BEGIN: MobileContainer -->
<!-- Mimics mobile iOS viewport (Screen 5: Login Success) -->
<main class="w-full max-w-[390px] h-[844px] bg-white rounded-[44px] shadow-2xl overflow-hidden flex flex-col relative border-[6px] border-slate-900 border-opacity-10 justify-between">
<!-- BEGIN: iOSStatusBar -->
<!-- iPhone status bar with 9:41 time and standard network/battery indicators -->
<header class="w-full pt-3 px-7 flex justify-between items-center z-20 shrink-0 select-none">
<span class="text-sm font-semibold tracking-tight text-slate-800">9:41</span>
<div class="flex items-center space-x-2 text-slate-800">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="3" rx="0.5" width="3" x="0" y="9"></rect>
<rect height="6" rx="0.5" width="3" x="4.5" y="6"></rect>
<rect height="9" rx="0.5" width="3" x="9" y="3"></rect>
<rect height="12" rx="0.5" width="3" x="13.5" y="0"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.8C5.2 2.8 2.7 3.9 0.8 5.7L0 4.8C2.2 2.7 5 1.4 8 1.4s5.8 1.3 8 3.4l-0.8 0.9C13.3 3.9 10.8 2.8 8 2.8z"></path>
<path d="M8 6C6.1 6 4.4 6.8 3.1 8.1L2.3 7.2C3.8 5.6 5.8 4.7 8 4.7s4.2 0.9 5.7 2.5l-0.8 0.9C11.6 6.8 9.9 6 8 6z"></path>
<circle cx="8" cy="10.5" r="1.5"></circle>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-slate-700 rounded-sm p-0.5 flex items-center">
<div class="h-full w-3/4 bg-slate-800 rounded-2xs"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: ConfettiAccents -->
<!-- Floating festive confetti ribbons & specks mimicking reference design -->
<div aria-hidden="true" class="absolute inset-0 pointer-events-none overflow-hidden z-0">
<!-- Confetti specks -->
<span class="absolute top-24 left-10 w-2 h-2 rounded-full bg-amber-400 opacity-80"></span>
<span class="absolute top-36 left-16 w-3 h-1.5 rounded-sm bg-rose-400 rotate-45 opacity-75"></span>
<span class="absolute top-20 right-14 w-2 h-2 rounded-full bg-sky-400 opacity-70"></span>
<span class="absolute top-32 right-20 w-1.5 h-3.5 rounded-sm bg-emerald-400 -rotate-12 opacity-80"></span>
<span class="absolute top-48 left-12 w-2 h-3.5 rounded-sm bg-indigo-500 rotate-12 opacity-75"></span>
<span class="absolute top-52 right-12 w-3 h-1 rounded-sm bg-amber-500 rotate-45 opacity-80"></span>
<span class="absolute top-64 left-20 w-2 h-2 rounded-full bg-emerald-500 opacity-60"></span>
<span class="absolute top-72 right-16 w-2.5 h-2.5 rounded-full bg-rose-400 opacity-70"></span>
<span class="absolute top-80 left-10 w-3 h-1.5 rounded bg-sky-500 -rotate-45 opacity-70"></span>
</div>
<!-- END: ConfettiAccents -->
<!-- BEGIN: MainContent -->
<!-- Success Badge, Welcome Message, and Dot Navigation -->
<section class="flex-1 flex flex-col items-center justify-center px-8 z-10 text-center mt-6">
<!-- Circular Green Success Icon -->
<div class="w-28 h-28 rounded-full bg-brand-700 flex items-center justify-center shadow-lg shadow-brand-700/20 mb-8 transform transition-transform hover:scale-105 duration-300">
<svg class="w-14 h-14 text-white stroke-[3.5]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
</div>
<!-- Welcome Back Title -->
<h1 class="text-2xl font-bold text-slate-800 tracking-tight mb-3">
        Welcome Back!
      </h1>
<!-- Informative Subtext -->
<p class="text-sm leading-relaxed text-slate-500 max-w-[260px] mb-8 font-normal">
        You're now signed in to Scheme App. Let's find new opportunities together.
      </p>
<!-- Carousel Pagination Dots (Center dot active) -->
<nav aria-label="Progress" class="flex items-center space-x-2">
<span class="w-2 h-2 rounded-full bg-slate-300"></span>
<span class="w-2.5 h-2.5 rounded-full bg-brand-700"></span>
<span class="w-2 h-2 rounded-full bg-slate-300"></span>
</nav>
</section>
<!-- END: MainContent -->
<!-- BEGIN: BottomSection -->
<!-- India Gate / Civic Architectural Silhouette and Primary CTA Button -->
<footer class="w-full relative pb-8 px-6 flex flex-col items-center z-10">
<!-- Architectural Silhouette (India Gate / Monuments) -->
<div aria-hidden="true" class="w-full flex justify-center items-end opacity-20 mb-6 text-brand-900 pointer-events-none select-none">
<svg class="w-full max-w-[280px] h-20 fill-current" viewbox="0 0 300 90">
<!-- Central Arch / India Gate style structure -->
<path d="M125,90 L125,50 L120,50 L120,45 L125,45 L125,25 L118,25 L118,20 L132,20 L132,15 L168,15 L168,20 L182,20 L182,25 L175,25 L175,45 L180,45 L180,50 L175,50 L175,90 L160,90 L160,65 Q160,55 150,55 Q140,55 140,65 L140,90 Z"></path>
<!-- Pillars & Steps -->
<rect height="5" width="30" x="135" y="10"></rect>
<rect height="4" width="80" x="110" y="86"></rect>
<!-- Adjacent Domes / Heritage Monument Outlines -->
<path d="M50,90 L50,70 Q50,58 65,58 Q80,58 80,70 L80,90 Z"></path>
<circle cx="65" cy="56" r="2"></circle>
<rect height="4" width="2" x="64" y="52"></rect>
<path d="M220,90 L220,70 Q220,58 235,58 Q250,58 250,70 L250,90 Z"></path>
<circle cx="235" cy="56" r="2"></circle>
<rect height="4" width="2" x="234" y="52"></rect>
<!-- Distant Minarets/Trees -->
<path d="M25,90 L25,65 Q28,60 30,65 L30,90 Z"></path>
<path d="M270,90 L270,65 Q272,60 275,65 L275,90 Z"></path>
</svg>
</div>
<!-- Action Button -->
<button class="w-full h-12 bg-brand-700 hover:bg-brand-800 active:scale-[0.99] text-white font-medium text-base rounded-lg shadow-sm transition-all duration-150 flex items-center justify-center" type="button">
        Go to Advisor
      </button>
<!-- iOS Bottom Home Indicator Bar -->
<div class="w-32 h-1 bg-slate-900/40 rounded-full mt-6"></div>
</footer>
<!-- END: BottomSection -->
</main>
<!-- END: MobileContainer -->
</body></html>
