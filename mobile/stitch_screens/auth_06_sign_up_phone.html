<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Scheme App - Sign Up</title>
<!-- Tailwind CSS CDN with Forms Plugin -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#16a34a',
              700: '#0E6245', // Primary brand color from Scheme App
              800: '#0b4d37',
              900: '#073324'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'San Francisco', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'sans-serif']
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* Fix mobile viewport overflow & iOS safe areas */
    body {
      -webkit-tap-highlight-color: transparent;
    }
    .safe-top {
      padding-top: env(safe-area-inset-top, 0px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen text-slate-800 antialiased font-sans p-0 sm:p-4">
<!-- BEGIN: PhoneFrameContainer -->
<!-- Mimics mobile viewport size and appearance -->
<main class="w-full max-w-[390px] h-[844px] bg-white sm:rounded-[44px] shadow-2xl overflow-hidden flex flex-col justify-between border border-slate-200 relative">
<!-- BEGIN: TopBar -->
<header class="w-full safe-top pt-3 px-6 pb-2" data-purpose="navigation-header">
<!-- Status Bar Area (iOS aesthetic) -->
<div class="flex justify-between items-center text-xs font-semibold text-slate-800 mb-3 px-1">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="3" rx="0.5" width="2.5" x="0" y="9"></rect>
<rect height="6" rx="0.5" width="2.5" x="4" y="6"></rect>
<rect height="9" rx="0.5" width="2.5" x="8" y="3"></rect>
<rect height="12" rx="0.5" width="2.5" x="12" y="0"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 10.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zm-4.2-3a5.9 5.9 0 0 1 8.4 0 .8.8 0 0 1-1.1 1.1 4.3 4.3 0 0 0-6.2 0 .8.8 0 0 1-1.1-1.1zm-3-3a10.1 10.1 0 0 1 14.4 0 .8.8 0 1 1-1.1 1.1 8.5 8.5 0 0 0-12.2 0 .8.8 0 0 1-1.1-1.1z" transform="translate(0 -2)"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 border border-slate-800 rounded-sm p-0.5 flex items-center">
<div class="w-full h-full bg-slate-800 rounded-[1px]"></div>
</div>
</div>
</div>
<!-- Back Navigation Button -->
<div class="flex items-center h-8">
<button aria-label="Go back" class="p-1 -ml-1 text-slate-700 hover:text-slate-900 transition-colors focus:outline-none" type="button">
<svg class="w-6 h-6 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Tab Switcher: Login | Sign Up -->
<nav class="flex border-b border-slate-200 mt-2" data-purpose="auth-toggle">
<button class="w-1/2 py-2 text-center text-sm font-semibold text-slate-500 hover:text-slate-700" type="button">
          Login
        </button>
<button class="w-1/2 py-2 text-center text-sm font-bold text-brand-700 border-b-2 border-brand-700 relative" type="button">
          Sign Up
        </button>
</nav>
</header>
<!-- END: TopBar -->
<!-- BEGIN: MainContent -->
<section class="flex-1 px-6 pt-5 pb-4 flex flex-col justify-start overflow-y-auto" data-purpose="sign-up-content">
<!-- Title and Subtitle -->
<div class="mb-6">
<h1 class="text-xl font-bold text-slate-900 tracking-tight">Create Your Account</h1>
<p class="text-xs text-slate-500 mt-1 leading-relaxed">
          Join Scheme App to access government schemes and more.
        </p>
</div>
<!-- Registration Form -->
<form class="space-y-4" data-purpose="signup-form" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div>
<label class="block text-xs font-medium text-slate-700 mb-1.5" for="full-name">
            Full Name
          </label>
<input class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-700 focus:border-brand-700 transition shadow-sm" id="full-name" name="fullName" placeholder="Enter your full name" type="text" value="Rohit Kumar"/>
</div>
<!-- Phone Number Field -->
<div>
<label class="block text-xs font-medium text-slate-700 mb-1.5" for="phone-number">
            Phone Number
          </label>
<div class="flex rounded-lg border border-slate-300 shadow-sm focus-within:ring-2 focus-within:ring-brand-700 focus-within:border-brand-700 bg-white overflow-hidden">
<!-- Country Code Selector Button -->
<button aria-label="Select Country Code" class="flex items-center space-x-1.5 px-3 py-2.5 bg-slate-50 border-r border-slate-300 text-xs font-medium text-slate-700 hover:bg-slate-100 focus:outline-none" type="button">
<!-- Indian Flag Emoji Representation -->
<span class="text-sm">🇮🇳</span>
<span class="text-xs text-slate-800 font-semibold">+91</span>
<svg class="w-3.5 h-3.5 text-slate-400 fill-current ml-0.5" viewbox="0 0 20 20">
<path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"></path>
</svg>
</button>
<!-- Phone Input -->
<input class="flex-1 min-w-0 border-0 py-2.5 px-3.5 text-sm text-slate-900 placeholder-slate-400 focus:ring-0 focus:outline-none" id="phone-number" name="phone" placeholder="9876543210" type="tel" value="9876543210"/>
</div>
</div>
<!-- Submit Action Button -->
<div class="pt-2">
<button class="w-full bg-brand-700 hover:bg-brand-800 active:bg-brand-900 text-white font-medium py-3 px-4 rounded-xl text-sm shadow-md transition duration-150 flex items-center justify-center space-x-2" type="submit">
<span>Send OTP</span>
</button>
</div>
</form>
</section>
<!-- END: MainContent -->
<!-- BEGIN: LegalFooter -->
<footer class="px-8 pb-8 pt-2 safe-bottom text-center" data-purpose="footer-terms">
<p class="text-[11px] leading-relaxed text-slate-400 max-w-xs mx-auto">
        By creating an account, you agree to our 
        <a class="text-slate-600 font-medium hover:underline" href="#">Terms of Service</a> 
        and 
        <a class="text-slate-600 font-medium hover:underline" href="#">Privacy Policy</a>
</p>
<!-- iOS Home Indicator bar -->
<div class="w-32 h-1 bg-slate-300 rounded-full mx-auto mt-4"></div>
</footer>
<!-- END: LegalFooter -->
</main>
<!-- END: PhoneFrameContainer -->
</body></html>
