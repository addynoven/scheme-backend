<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Vault - Upload Document Modal</title>
<!-- Tailwind CSS CDN with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#15803d',
              600: '#166534',
              700: '#14532d',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* iOS safe-area adaptation and custom modal shadow */
    .modal-sheet-shadow {
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.12), 0 0 1px 1px rgba(0, 0, 0, 0.05);
    }
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-0 sm:p-4 antialiased text-slate-800">
<!-- BEGIN: PhoneFrame -->
<main class="w-full max-w-[390px] h-[844px] bg-slate-50 relative overflow-hidden sm:rounded-[44px] sm:ring-8 sm:ring-slate-800 shadow-2xl flex flex-col justify-between" data-purpose="mobile-screen-container">
<!-- BEGIN: BackgroundVaultMockup -->
<!-- Faded / blurred representation of Document Vault underneath modal -->
<div class="absolute inset-0 bg-slate-50 z-0 pointer-events-none filter blur-[1px] opacity-60">
<!-- Background Header Mockup -->
<div class="h-28 bg-white border-b border-slate-100 px-6 pt-12 flex justify-between items-center">
<div class="w-6 h-6 bg-slate-200 rounded"></div>
<div class="w-32 h-4 bg-slate-200 rounded"></div>
<div class="w-8 h-8 bg-slate-200 rounded-full"></div>
</div>
<!-- Content Background Mock -->
<div class="p-5 space-y-4">
<div class="h-14 bg-white rounded-xl border border-slate-100"></div>
<div class="h-44 bg-white rounded-2xl border border-slate-100"></div>
<div class="h-28 bg-white rounded-xl border border-slate-100"></div>
</div>
</div>
<!-- END: BackgroundVaultMockup -->
<!-- BEGIN: ModalOverlay -->
<!-- Translucent backdrop overlay -->
<div aria-hidden="true" class="absolute inset-0 bg-slate-900/40 backdrop-blur-[2px] z-10"></div>
<!-- END: ModalOverlay -->
<!-- BEGIN: UploadDocumentModal -->
<section aria-labelledby="modal-title" aria-modal="true" class="relative z-20 mt-auto w-full bg-white rounded-t-[28px] modal-sheet-shadow flex flex-col max-h-[92%] overflow-hidden" data-purpose="upload-document-modal" role="dialog">
<!-- iOS Bottom Sheet Grab Handle -->
<div aria-hidden="true" class="w-full flex justify-center pt-3 pb-1">
<div class="w-10 h-1 bg-slate-200 rounded-full"></div>
</div>
<!-- BEGIN: ModalHeader -->
<header class="px-6 py-3 flex items-center justify-between border-b border-slate-50" data-purpose="modal-header">
<div class="w-7"></div> <!-- Spacer for centering title -->
<h1 class="text-base font-semibold text-slate-800 tracking-tight" id="modal-title">
          Upload Document
        </h1>
<!-- Close Button -->
<button aria-label="Close modal" class="w-7 h-7 flex items-center justify-center rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-slate-700 transition" data-purpose="close-modal-button" type="button">
<svg class="w-4 h-4 stroke-2" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</header>
<!-- END: ModalHeader -->
<!-- BEGIN: ModalBody -->
<div class="px-6 pt-5 pb-6 overflow-y-auto" data-purpose="modal-content-body">
<!-- Header Visual & Instructions -->
<div class="text-center flex flex-col items-center mb-6" data-purpose="upload-prompt">
<!-- Icon Circle Container -->
<div class="w-16 h-16 rounded-full bg-emerald-50 border border-emerald-100 flex items-center justify-center mb-3.5 shadow-sm">
<svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<h2 class="text-lg font-semibold text-slate-900 tracking-tight mb-1">
            Add a Document
          </h2>
<p class="text-xs text-slate-500 max-w-[260px] leading-relaxed">
            Take a clear photo or upload a file.<br/>Supports JPG, PNG, PDF (max 10 MB)
          </p>
</div>
<!-- BEGIN: ActionOptionsList -->
<!-- Upload Methods / Action Cards -->
<div class="space-y-3" data-purpose="upload-options">
<!-- Option 1: Take Photo -->
<button class="w-full bg-white border border-slate-200/90 hover:border-emerald-500 hover:shadow-sm rounded-xl p-3.5 flex items-center justify-between transition group text-left" data-purpose="option-take-photo" type="button">
<div class="flex items-center space-x-3.5">
<div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0 group-hover:bg-emerald-100 transition">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<p class="text-sm font-semibold text-slate-800 leading-snug">Take Photo</p>
<p class="text-xs text-slate-400 font-normal">Open camera and scan</p>
</div>
</div>
<svg class="w-4 h-4 text-slate-300 group-hover:text-emerald-600 transition shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Option 2: Choose from Gallery -->
<button class="w-full bg-white border border-slate-200/90 hover:border-emerald-500 hover:shadow-sm rounded-xl p-3.5 flex items-center justify-between transition group text-left" data-purpose="option-choose-gallery" type="button">
<div class="flex items-center space-x-3.5">
<div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0 group-hover:bg-emerald-100 transition">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<p class="text-sm font-semibold text-slate-800 leading-snug">Choose from Gallery</p>
<p class="text-xs text-slate-400 font-normal">Select from your photos</p>
</div>
</div>
<svg class="w-4 h-4 text-slate-300 group-hover:text-emerald-600 transition shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Option 3: Upload File -->
<button class="w-full bg-white border border-slate-200/90 hover:border-emerald-500 hover:shadow-sm rounded-xl p-3.5 flex items-center justify-between transition group text-left" data-purpose="option-upload-file" type="button">
<div class="flex items-center space-x-3.5">
<div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0 group-hover:bg-emerald-100 transition">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<p class="text-sm font-semibold text-slate-800 leading-snug">Upload File</p>
<p class="text-xs text-slate-400 font-normal">Choose PDF or image</p>
</div>
</div>
<svg class="w-4 h-4 text-slate-300 group-hover:text-emerald-600 transition shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- END: ActionOptionsList -->
<!-- BEGIN: SupportedDocumentsSection -->
<!-- Informational banner at the bottom of the modal -->
<div class="mt-6 p-3.5 bg-emerald-50/70 rounded-xl border border-emerald-100/80 flex items-start space-x-3" data-purpose="supported-docs-info">
<!-- Information / Certificate Icon -->
<div class="mt-0.5 w-6 h-6 rounded-full bg-emerald-600 text-white flex items-center justify-center shrink-0 shadow-xs">
<svg class="w-3.5 h-3.5" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M10 2a1 1 0 011 1v1.323l3.954 1.582 1.599-.8a1 1 0 01.894 1.79l-1.233.616 1.738 5.42a1 1 0 01-.285 1.05A3.989 3.989 0 0115 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.715-5.349L11 6.477V16h2a1 1 0 110 2H7a1 1 0 110-2h2V6.477L6.237 7.582l1.715 5.349a1 1 0 01-.285 1.05A3.989 3.989 0 015 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.738-5.42-1.233-.617a1 1 0 01.894-1.788l1.599.799L9 4.323V3a1 1 0 011-1z" fill-rule="evenodd"></path>
</svg>
</div>
<div>
<h3 class="text-xs font-semibold text-emerald-900 leading-snug">Supported Documents</h3>
<p class="text-[11px] text-emerald-800/80 mt-0.5 leading-relaxed">
              Aadhaar, PAN, Income Certificate, Land Records, Bank Passbook, etc.
            </p>
</div>
</div>
<!-- END: SupportedDocumentsSection -->
</div>
<!-- END: ModalBody -->
<!-- Safe Area Bottom Bar Spacer (iOS Home Indicator) -->
<div class="h-6 w-full flex items-center justify-center pb-2">
<div class="w-32 h-1 bg-slate-300 rounded-full"></div>
</div>
</section>
<!-- END: UploadDocumentModal -->
</main>
<!-- END: PhoneFrame -->
</body></html>
