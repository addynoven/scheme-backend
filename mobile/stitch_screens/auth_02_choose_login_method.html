<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Scheme App - Choose Login Method</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#006B4D',
              dark: '#00543B',
              light: '#E6F4EE',
              surface: '#F4F9F6'
            },
            text: {
              primary: '#1A1D1E',
              secondary: '#6B7280',
              muted: '#9CA3AF'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* Mobile canvas viewport wrapper */
    body {
      background-color: #ECEEF2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 100%;
      max-width: 390px;
      height: 844px;
      background: #FFFFFF;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.15);
      border-radius: 40px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 8px solid #1A1A1A;
    }
  </style>
</head>
<body>
<!-- BEGIN: MobileDeviceContainer -->
<main class="mobile-frame" data-purpose="screen-container">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full pt-3 px-7 pb-1 flex justify-between items-center text-xs font-semibold text-black tracking-tight z-10 select-none">
<span class="text-sm font-semibold tracking-tight">9:41</span>
<div class="flex items-center space-x-1.5">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="3.5" rx="0.75" width="2.5" x="0.5" y="8.5"></rect>
<rect height="6" rx="0.75" width="2.5" x="4.5" y="6"></rect>
<rect height="8.5" rx="0.75" width="2.5" x="8.5" y="3.5"></rect>
<rect height="11.5" rx="0.75" width="2.5" x="12.5" y="0.5"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 12a1.5 1.5 0 100-3 1.5 1.5 0 000 3zm4.07-4.07a5.75 5.75 0 00-8.14 0 .75.75 0 01-1.06-1.06 7.25 7.25 0 0110.26 0 .75.75 0 01-1.06 1.06zm2.83-2.83a9.75 9.75 0 00-13.8 0 .75.75 0 01-1.06-1.06 11.25 11.25 0 0115.92 0 .75.75 0 01-1.06 1.06z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-current rounded-sm p-0.5 flex items-center">
<div class="w-full h-full bg-current rounded-2xs"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: NavigationBar -->
<nav class="px-5 pt-1 pb-2 flex items-center" data-purpose="top-navigation">
<button aria-label="Go back" class="p-1.5 -ml-1.5 text-gray-700 hover:text-black transition-colors rounded-full focus:outline-none" type="button">
<svg class="w-6 h-6 stroke-[2.2] stroke-current fill-none" viewbox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</nav>
<!-- END: NavigationBar -->
<!-- Scrollable Content Area -->
<div class="flex-1 px-6 overflow-y-auto flex flex-col justify-between pb-8">
<div>
<!-- BEGIN: AuthSegmentedTabs -->
<div class="flex border-b border-gray-200 mt-2 mb-8" data-purpose="auth-tabs">
<!-- Login Tab (Active) -->
<button class="flex-1 pb-3 text-center text-[15px] font-semibold text-[#006B4D] relative" type="button">
            Login
            <span class="absolute bottom-0 left-1/2 -translate-x-1/2 w-14 h-[2.5px] bg-[#006B4D] rounded-full"></span>
</button>
<!-- Sign Up Tab (Inactive) -->
<button class="flex-1 pb-3 text-center text-[15px] font-medium text-gray-400 hover:text-gray-600 transition-colors" type="button">
            Sign Up
          </button>
</div>
<!-- END: AuthSegmentedTabs -->
<!-- BEGIN: SocialLoginGoogle -->
<button class="w-full flex items-center justify-center space-x-3 py-3 px-4 border border-gray-300 rounded-xl hover:bg-gray-50 active:bg-gray-100 transition shadow-sm font-medium text-[15px] text-gray-700" data-purpose="google-login-btn" type="button">
<!-- Google 'G' Logo -->
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
<!-- END: SocialLoginGoogle -->
<!-- BEGIN: FirstDivider -->
<div class="relative my-7 flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-200"></div>
</div>
<span class="relative bg-white px-3 text-[11px] font-semibold text-gray-400 tracking-wider">OR</span>
</div>
<!-- END: FirstDivider -->
<!-- BEGIN: PhoneLoginForm -->
<form data-purpose="phone-login-form" onsubmit="event.preventDefault();">
<label class="block text-xs font-semibold text-gray-700 mb-2">Phone Number</label>
<!-- Input Container -->
<div class="flex items-center w-full border border-gray-300 rounded-xl overflow-hidden focus-within:border-[#006B4D] focus-within:ring-1 focus-within:ring-[#006B4D] bg-white transition-all shadow-sm">
<!-- Country Selector -->
<button class="flex items-center space-x-1 pl-3.5 pr-2 py-3 bg-transparent text-gray-800 text-sm font-medium focus:outline-none select-none" type="button">
<!-- India Flag SVG -->
<span class="inline-block w-4 h-3 rounded-[2px] overflow-hidden shadow-xs mr-0.5">
<svg class="w-full h-full object-cover" viewbox="0 0 640 480">
<path d="M0 0h640v160H0z" fill="#f93"></path>
<path d="M0 160h640v160H0z" fill="#fff"></path>
<path d="M0 320h640v160H0z" fill="#128807"></path>
<circle cx="320" cy="240" fill="#008" r="40"></circle>
<circle cx="320" cy="240" fill="#fff" r="35"></circle>
<circle cx="320" cy="240" fill="#008" r="8"></circle>
</svg>
</span>
<span class="text-[14px] text-gray-700 font-medium">+91</span>
<svg class="w-3.5 h-3.5 text-gray-500 fill-current" viewbox="0 0 20 20">
<path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"></path>
</svg>
</button>
<!-- Vertical subtle line -->
<div class="w-px h-5 bg-gray-200"></div>
<!-- Phone Input Box -->
<input class="w-full py-3 px-3.5 text-gray-900 placeholder-gray-400 font-medium text-[15px] border-0 focus:ring-0 focus:outline-none" name="phone" placeholder="Enter phone number" type="tel" value="9876543210"/>
</div>
<!-- Primary Submit Button -->
<button class="w-full mt-4 bg-[#006B4D] hover:bg-[#00573e] active:bg-[#004834] text-white font-semibold text-[15px] py-3.5 px-4 rounded-xl shadow-md shadow-[#006B4D]/20 transition duration-150 ease-in-out" type="submit">
            Send OTP
          </button>
</form>
<!-- END: PhoneLoginForm -->
<!-- BEGIN: SecondDivider -->
<div class="relative my-7 flex items-center justify-center">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-200"></div>
</div>
<span class="relative bg-white px-3 text-[11px] font-semibold text-gray-400 tracking-wider">OR</span>
</div>
<!-- END: SecondDivider -->
<!-- BEGIN: AlternativeEmailLogin -->
<button class="w-full flex items-center justify-between py-3 px-4 border border-gray-200 rounded-xl hover:bg-gray-50 active:bg-gray-100 transition shadow-sm font-medium text-[14px] text-gray-700 group" data-purpose="email-option-btn" type="button">
<div class="flex items-center space-x-3">
<!-- Mail Icon -->
<svg class="w-5 h-5 text-gray-500 group-hover:text-gray-700 transition-colors" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<span>Continue with Email</span>
</div>
<!-- Chevron Right -->
<svg class="w-4 h-4 text-gray-400 group-hover:text-gray-600 transition-colors" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- END: AlternativeEmailLogin -->
</div>
<!-- BEGIN: BottomSignupLink -->
<footer class="text-center pt-6" data-purpose="footer-signup-link">
<p class="text-xs text-gray-500 font-normal">
          New to Scheme App? 
          <a class="block mt-0.5 font-semibold text-[#006B4D] hover:underline focus:outline-none" href="#">
            Create an account
          </a>
</p>
</footer>
<!-- END: BottomSignupLink -->
</div>
<!-- iOS Home Indicator -->
<div class="w-full flex justify-center pb-2 pt-1 pointer-events-none">
<div class="w-32 h-1 bg-black/30 rounded-full"></div>
</div>
</main>
<!-- END: MobileDeviceContainer -->
</body></html>
