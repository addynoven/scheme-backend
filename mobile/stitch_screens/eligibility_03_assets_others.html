<body class="bg-slate-100 flex items-center justify-center min-h-screen p-0 sm:p-4 font-sans antialiased text-slate-800 selection:bg-brand-500 selection:text-white">

<header class="w-full pt-3 px-7 flex justify-between items-center z-20 shrink-0 select-none" data-purpose="ios-status-bar">

<!-- Dynamic Island / Speaker Notch Simulation -->

<div class="flex items-center space-x-1.5 text-slate-900">

<rect height="11.5" rx="0.5" width="2.5" x="12" y="0.5"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path clip-rule="evenodd" d="M8 2.5C5.2 2.5 2.7 3.6 0.9 5.4L0 4.5C2.1 2.4 5 1 8 1C11 1 13.9 2.4 16 4.5L15.1 5.4C13.3 3.6 10.8 2.5 8 2.5ZM8 6.5C6.3 6.5 4.8 7.2 3.7 8.3L2.8 7.4C4.1 6.1 6 5.2 8 5.2C10 5.2 11.9 6.1 13.2 7.4L12.3 8.3C11.2 7.2 9.7 6.5 8 6.5ZM8 10.5C7.2 10.5 6.5 11.2 6.5 12C6.5 12.8 7.2 13.5 8 13.5C8.8 13.5 9.5 12.8 9.5 12C9.5 11.2 8.8 10.5 8 10.5Z" fill-rule="evenodd"></path>
</svg>
<!-- Battery Icon -->
<svg class="w-6 h-3" fill="none" viewbox="0 0 25 12">
<rect height="11" rx="3" stroke="currentColor" width="21" x="0.5" y="0.5"></rect>
<rect fill="currentColor" height="8" rx="1.5" width="16" x="2" y="2"></rect>
<path d="M23 4.5V7.5" stroke="currentColor" stroke-linecap="round"></path>
</svg>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: TopNavigationBar -->
<section class="px-5 pt-3 pb-2 flex items-center relative shrink-0" data-purpose="navigation-header">
<!-- Back Button -->
<button aria-label="Go back" class="p-1 -ml-1 text-slate-700 hover:text-slate-900 transition-colors focus:outline-none" type="button">
<svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Center Step Title and Subtitle -->
<div class="flex-1 text-center pr-5">
<span class="text-[11px] font-semibold tracking-wider text-slate-400 uppercase block mb-0.5">Step 3 of 3</span>
<h1 class="text-base font-bold text-slate-900 leading-tight">Assets &amp; Others</h1>
<p class="text-[12px] text-slate-500 leading-none mt-0.5">A few more details</p>
</div>
</section>
<!-- END: TopNavigationBar -->
<!-- BEGIN: StepperIndicator -->
<section class="px-6 py-2 shrink-0" data-purpose="stepper-progress">
<div class="relative flex items-center justify-between max-w-[280px] mx-auto">

<!-- Step 1: Completed -->
<div class="flex flex-col items-center relative z-10">
<div class="w-7 h-7 rounded-full bg-brand-800 flex items-center justify-center text-white shadow-sm ring-4 ring-white">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[10px] font-medium text-slate-400 mt-1">Demographics</span>
</div>
<!-- Step 2: Completed -->
<div class="flex flex-col items-center relative z-10">
<div class="w-7 h-7 rounded-full bg-brand-800 flex items-center justify-center text-white shadow-sm ring-4 ring-white">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[10px] font-medium text-slate-400 mt-1">Economic</span>
</div>
<!-- Step 3: Current Active Step -->
<div class="flex flex-col items-center relative z-10">
<div class="w-7 h-7 rounded-full bg-brand-800 text-white font-bold text-xs flex items-center justify-center shadow-sm ring-4 ring-white">
            3
          </div>
<span class="text-[10px] font-semibold text-brand-800 mt-1">Assets</span>
</div>
</div>
</section>

<!-- BEGIN: FormContent -->
<section class="flex-1 overflow-y-auto px-5 py-2 space-y-4" data-purpose="form-toggles">
<!-- Field 1: Agricultural Land (Toggle ON with Sub-card) -->
<div class="space-y-2">
<div class="flex items-center justify-between pt-1">
<label class="text-[13.5px] font-medium text-slate-800 leading-snug pr-3 select-none" for="toggle-agri-land">
            Do you own agricultural land?
          </label>
<!-- Active Green Toggle -->
<button aria-checked="true" class="w-12 h-6 bg-brand-800 rounded-full p-0.5 transition-colors duration-200 ease-in-out focus:outline-none shrink-0 relative" id="toggle-agri-land" role="switch" type="button">
<span class="translate-x-6 block w-5 h-5 bg-white rounded-full shadow-sm transform transition duration-200 ease-in-out"></span>
</button>
</div>
<!-- Expanded Sub-card for Land Details -->
<div class="bg-[#f0fbf4] border border-brand-100 rounded-xl p-3 space-y-2" data-purpose="conditional-land-input">
<div class="flex items-center space-x-1.5 text-brand-800 font-semibold text-[12.5px]">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M4.5 12.75l6 6 9-13.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Yes, I own agricultural land</span>
</div>
<div class="space-y-1">
<label class="block text-[11px] font-medium text-slate-500" for="land-size">
              Approximate land size (optional)
            </label>
<div class="relative">
<input class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-xs font-semibold text-slate-800 focus:ring-1 focus:ring-brand-700 focus:border-brand-700 focus:outline-none shadow-sm" id="land-size" type="text" value="2 acres"/>
</div>
</div>
</div>
</div>
<!-- Field 2: Disability (PwD) - Toggle OFF -->
<div class="flex items-center justify-between py-1.5 border-t border-slate-100">
<label class="text-[13px] font-medium text-slate-800 leading-snug pr-3 select-none" for="toggle-disability">
          Are you a person with disability (PwD)?
        </label>
<button aria-checked="false" class="w-12 h-6 bg-slate-200 rounded-full p-0.5 transition-colors duration-200 ease-in-out focus:outline-none shrink-0 relative" id="toggle-disability" role="switch" type="button">
<span class="translate-x-0 block w-5 h-5 bg-white rounded-full shadow-sm transform transition duration-200 ease-in-out"></span>
</button>
</div>
<!-- Field 3: Widow / Single Parent - Toggle OFF -->
<div class="flex items-center justify-between py-1.5 border-t border-slate-100">
<label class="text-[13px] font-medium text-slate-800 leading-snug pr-3 select-none" for="toggle-widow">
          Are you a widow / single parent?
        </label>
<button aria-checked="false" class="w-12 h-6 bg-slate-200 rounded-full p-0.5 transition-colors duration-200 ease-in-out focus:outline-none shrink-0 relative" id="toggle-widow" role="switch" type="button">
<span class="translate-x-0 block w-5 h-5 bg-white rounded-full shadow-sm transform transition duration-200 ease-in-out"></span>
</button>
</div>
<!-- Field 4: Ration Card - Toggle ON -->
<div class="flex items-center justify-between py-1.5 border-t border-slate-100">
<label class="text-[13px] font-medium text-slate-800 leading-snug pr-3 select-none" for="toggle-ration-card">
          Do you have a ration card?
        </label>
<button aria-checked="true" class="w-12 h-6 bg-brand-800 rounded-full p-0.5 transition-colors duration-200 ease-in-out focus:outline-none shrink-0 relative" id="toggle-ration-card" role="switch" type="button">
<span class="translate-x-6 block w-5 h-5 bg-white rounded-full shadow-sm transform transition duration-200 ease-in-out"></span>
</button>
</div>
<!-- Field 5: Rural Area - Toggle ON -->
<div class="flex items-center justify-between py-1.5 border-t border-slate-100">
<label class="text-[13px] font-medium text-slate-800 leading-snug pr-3 select-none" for="toggle-rural-area">
          Do you live in a rural area?
        </label>
<button aria-checked="true" class="w-12 h-6 bg-brand-800 rounded-full p-0.5 transition-colors duration-200 ease-in-out focus:outline-none shrink-0 relative" id="toggle-rural-area" role="switch" type="button">
<span class="translate-x-6 block w-5 h-5 bg-white rounded-full shadow-sm transform transition duration-200 ease-in-out"></span>
</button>
</div>
</section>

</svg>
</button>

<div class="w-32 h-1 bg-slate-900/40 rounded-full mt-4"></div>
