<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Scheme App - Voice Input</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#15803d',
              600: '#166534',
              700: '#14532d',
              primary: '#0a7d55',
              accent: '#e7f7f0',
            }
          },
          animation: {
            'pulse-ring': 'pulseRing 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'wave': 'waveAnim 1.5s ease-in-out infinite alternate',
          },
          keyframes: {
            pulseRing: {
              '0%': { transform: 'scale(0.95)', opacity: '0.8' },
              '50%': { transform: 'scale(1.12)', opacity: '0.3' },
              '100%': { transform: 'scale(0.95)', opacity: '0.8' },
            },
            waveAnim: {
              '0%': { height: '14px' },
              '100%': { height: '36px' },
            }
          }
        }
      }
    }
  </script>
<!-- Style block for custom mobile aesthetics & ripple effects -->
<style data-purpose="custom-layout">
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .sound-wave-bar {
      width: 3px;
      border-radius: 9999px;
      background: #86efac;
      display: inline-block;
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-0 sm:p-4">
<!-- BEGIN: MobileDeviceFrame -->
<main class="w-full max-w-[390px] h-[844px] bg-white rounded-[44px] shadow-2xl overflow-hidden flex flex-col relative border-[8px] border-slate-900 select-none">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full px-7 pt-3.5 pb-1 flex justify-between items-center z-30 bg-white" data-purpose="status-bar">
<span class="text-[14px] font-semibold tracking-tight text-slate-800">9:41</span>
<!-- Right Status Icons: Cell Signal, Wifi, Battery -->
<div class="flex items-center space-x-2 text-slate-800">
<!-- Signal Strength -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="3" rx="0.5" width="2.5" x="0.5" y="8.5"></rect>
<rect height="5.5" rx="0.5" width="2.5" x="5" y="6"></rect>
<rect height="8.5" rx="0.5" width="2.5" x="9.5" y="3"></rect>
<rect height="11" rx="0.5" width="2.5" x="14" y="0.5"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.8c2.8 0 5.3 1.1 7.2 2.9l-1.3 1.3C12.3 5.4 10.3 4.5 8 4.5c-2.3 0-4.3.9-5.9 2.5L0.8 5.7C2.7 3.9 5.2 2.8 8 2.8zM8 6.5c1.8 0 3.4.7 4.6 1.9l-1.3 1.3C10.4 8.9 9.3 8.3 8 8.3c-1.3 0-2.4.6-3.3 1.4L3.4 8.4C4.6 7.2 6.2 6.5 8 6.5zm0 3.7a1.3 1.3 0 110 2.6 1.3 1.3 0 010-2.6z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-slate-700 rounded-sm p-0.5 flex items-center">
<div class="h-full w-full bg-slate-800 rounded-2xs"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: TopAppHeader -->
<header class="px-5 py-2 flex items-center justify-between border-b border-gray-100 bg-white z-20" data-purpose="app-navigation-header">
<div class="flex items-center space-x-2.5">
<!-- Leaf / App Logo -->
<div class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center shadow-sm">
<svg class="w-4 h-4 text-white" fill="currentColor" viewbox="0 0 24 24">
<path d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z"></path>
</svg>
</div>
<!-- Title & Subtitle -->
<div>
<h1 class="text-[15px] font-bold text-slate-800 leading-tight">Scheme App</h1>
<p class="text-[11px] font-medium text-emerald-600 flex items-center">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block mr-1"></span>
            Online
          </p>
</div>
</div>
<!-- Right Header Actions: Notification bell & Profile avatar -->
<div class="flex items-center space-x-3">
<!-- Notification Bell with Dot -->
<button aria-label="Notifications" class="text-slate-500 hover:text-slate-700 transition relative" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
<span class="absolute top-0 right-0.5 w-1.5 h-1.5 bg-red-500 rounded-full"></span>
</button>
<!-- Citizen Avatar -->
<div class="w-8 h-8 rounded-full border border-emerald-500 overflow-hidden bg-emerald-100 flex items-center justify-center">
<svg class="w-6 h-6 text-emerald-700" fill="currentColor" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0021.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 003.065 7.097A9.716 9.716 0 0012 21.75a9.716 9.716 0 006.685-2.653zm-12.54-1.285A7.486 7.486 0 0112 15a7.486 7.486 0 015.855 2.812A8.224 8.224 0 0112 20.25a8.224 8.224 0 01-5.855-2.438zM15.75 9a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" fill-rule="evenodd"></path>
</svg>
</div>
</div>
</header>
<!-- END: TopAppHeader -->
<!-- BEGIN: ChatHistorySection -->
<section class="flex-1 px-4 py-4 overflow-y-auto flex flex-col justify-between" data-purpose="chat-voice-interface">
<!-- Previous Sent Message (Right Bubble) -->
<div class="flex justify-end w-full mb-auto" data-purpose="user-message-bubble">
<div class="max-w-[85%] bg-[#eefbf4] border border-emerald-200/70 rounded-2xl rounded-tr-none px-4 py-3 shadow-xs">
<p class="text-[13.5px] leading-snug text-slate-800 font-normal">
            I am a farmer and I want to know about schemes for drip irrigation.
          </p>
<div class="flex items-center justify-end space-x-1 mt-1.5">
<span class="text-[10px] text-emerald-700 font-medium">10:24 AM</span>
<svg class="w-3.5 h-3.5 text-emerald-600 inline" fill="currentColor" viewbox="0 0 16 16">
<path d="M12.736 3.97a.733.733 0 0 1 1.047 0c.286.289.29.756.01 1.05L7.88 12.01a.733.733 0 0 1-1.065.02L3.217 8.384a.757.757 0 0 1 0-1.06.733.733 0 0 1 1.047 0l3.052 3.093 5.4-6.425a.247.247 0 0 1 .02-.022z"></path>
</svg>
</div>
</div>
</div>
<!-- BEGIN: ListeningAnimationState -->
<div class="my-auto flex flex-col items-center justify-center text-center py-4" data-purpose="voice-recording-modal">
<!-- Title -->
<h2 class="text-xl font-bold text-slate-800 mb-6 tracking-tight">Listening...</h2>
<!-- Central Pulsing Microphone Visual -->
<div class="relative flex items-center justify-center mb-6">
<!-- Radiating Sound Waves Left -->
<div class="flex items-center space-x-1 mr-4">
<span class="sound-wave-bar h-3 animate-[waveAnim_1.1s_ease-in-out_infinite_alternate]"></span>
<span class="sound-wave-bar h-6 animate-[waveAnim_1.4s_ease-in-out_infinite_alternate_0.2s]"></span>
<span class="sound-wave-bar h-10 animate-[waveAnim_1.2s_ease-in-out_infinite_alternate_0.4s]"></span>
<span class="sound-wave-bar h-5 animate-[waveAnim_1.5s_ease-in-out_infinite_alternate_0.1s]"></span>
</div>
<!-- Pulsing Rings Container -->
<div class="relative flex items-center justify-center">
<!-- Outer Glow Rings -->
<div class="absolute w-28 h-28 rounded-full bg-emerald-100 opacity-75 animate-pulse-ring"></div>
<div class="absolute w-24 h-24 rounded-full bg-emerald-200/60"></div>
<!-- Main Microphone Circle Button -->
<div class="relative w-20 h-20 rounded-full bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center shadow-lg shadow-emerald-500/25 z-10">
<svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 003-3V5a3 3 0 10-6 0v6a3 3 0 003 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Radiating Sound Waves Right -->
<div class="flex items-center space-x-1 ml-4">
<span class="sound-wave-bar h-5 animate-[waveAnim_1.5s_ease-in-out_infinite_alternate_0.1s]"></span>
<span class="sound-wave-bar h-10 animate-[waveAnim_1.2s_ease-in-out_infinite_alternate_0.3s]"></span>
<span class="sound-wave-bar h-6 animate-[waveAnim_1.4s_ease-in-out_infinite_alternate_0.15s]"></span>
<span class="sound-wave-bar h-3 animate-[waveAnim_1.1s_ease-in-out_infinite_alternate]"></span>
</div>
</div>
<!-- Language Guidance Subtext -->
<p class="text-xs font-medium text-slate-500 mb-6">
          Speak naturally in Hindi or English
        </p>
<!-- Tap To Stop Action Button -->
<button class="group flex flex-col items-center focus:outline-none" data-purpose="stop-recording-button" type="button">
<div class="w-11 h-11 rounded-full border-2 border-red-400/80 bg-red-50 text-red-500 flex items-center justify-center shadow-xs transition group-hover:bg-red-100 group-hover:scale-105 active:scale-95">
<svg class="w-5 h-5 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-xs font-semibold text-slate-700 mt-2">Tap to stop</span>
</button>
</div>
<!-- END: ListeningAnimationState -->
<!-- Empty buffer spacing for bottom scroll flow -->
<div class="h-2"></div>
</section>
<!-- END: ChatHistorySection -->
<!-- BEGIN: ChatInputBar -->
<footer class="px-4 py-2 bg-white border-t border-gray-100" data-purpose="chat-input-controls">
<div class="flex items-center space-x-2 bg-slate-50 border border-slate-200 rounded-full px-4 py-2">
<input class="bg-transparent border-0 text-xs text-slate-700 focus:ring-0 focus:outline-none flex-1 placeholder:text-slate-400 p-0" placeholder="Type your message..." type="text"/>
<!-- Attachment Clip -->
<button aria-label="Attach File" class="text-slate-400 hover:text-slate-600 transition" type="button">
<svg class="w-4 h-4 transform rotate-45" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Mini Microphone Icon -->
<button aria-label="Microphone" class="w-7 h-7 rounded-full bg-emerald-600 text-white flex items-center justify-center transition shadow-xs hover:bg-emerald-700" type="button">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 003-3V5a3 3 0 10-6 0v6a3 3 0 003 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</footer>
<!-- END: ChatInputBar -->
<!-- BEGIN: BottomNavigationBar -->
<nav class="bg-white border-t border-gray-100 px-6 py-2 flex justify-between items-center text-[10px]" data-purpose="bottom-tab-bar">
<!-- Tab 1: Advisor (Active) -->
<a class="flex flex-col items-center text-emerald-700 font-semibold space-y-1" href="#">
<svg class="w-5 h-5 text-emerald-700" fill="currentColor" viewbox="0 0 24 24">
<path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"></path>
</svg>
<span>Advisor</span>
</a>
<!-- Tab 2: Vault -->
<a class="flex flex-col items-center text-slate-400 hover:text-slate-600 space-y-1 font-medium" href="#">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Vault</span>
</a>
<!-- Tab 3: Check -->
<a class="flex flex-col items-center text-slate-400 hover:text-slate-600 space-y-1 font-medium" href="#">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Check</span>
</a>
<!-- Tab 4: Schemes -->
<a class="flex flex-col items-center text-slate-400 hover:text-slate-600 space-y-1 font-medium" href="#">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Schemes</span>
</a>
</nav>
<!-- END: BottomNavigationBar -->
<!-- iOS Home Indicator Indicator -->
<div class="w-full bg-white flex justify-center pb-2 pt-1" data-purpose="home-indicator">
<div class="w-32 h-1 bg-slate-300 rounded-full"></div>
</div>
</main>
<!-- END: MobileDeviceFrame -->
</body></html>
