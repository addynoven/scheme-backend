<!DOCTYPE html>

<html lang="en"><head>

</nav>
<!-- END: NavigationBar -->
<!-- Scrollable Screen Content -->
<div class="flex-1 px-6 flex flex-col justify-between overflow-y-auto">
<div>
<!-- BEGIN: SegmentedTabControl -->

<div class="flex justify-center items-center border-b border-slate-200">

<span class="text-emerald-700 font-semibold text-[15px]">Login</span>

</div>

<!-- BEGIN: SectionHeader -->

<!-- BEGIN: ChannelSelectionList -->

</svg>

<!-- Label and description -->

<span class="inline-block text-[10px] px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700 font-medium tracking-tight">Recommended</span>
</div>

</div>
</div>
<!-- Radio Indicator (Selected) -->
<div class="w-5 h-5 rounded-full bg-emerald-600 flex items-center justify-center shrink-0">
<svg class="w-3 h-3 text-white stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">

<div class="w-11 h-11 rounded-full bg-sky-500 flex items-center justify-center shrink-0 shadow-sm">

<div>
<span class="text-sm font-semibold text-slate-800">SMS</span>
<p class="text-xs text-slate-500 mt-0.5">Works on all phones</p>
</div>
</div>
<!-- Radio Indicator (Unselected) -->
<div class="w-5 h-5 rounded-full border-2 border-slate-300 shrink-0"></div>
<input class="sr-only" name="otp_channel" type="radio" value="sms"/>
</label>
<!-- Option 3: Telegram -->

</svg>
</div>
<!-- Label and description -->
<div>
<span class="text-sm font-semibold text-slate-800">Telegram</span>
<p class="text-xs text-slate-500 mt-0.5">Send via Telegram</p>
</div>
</div>
<!-- Radio Indicator (Unselected) -->
<div class="w-5 h-5 rounded-full border-2 border-slate-300 shrink-0"></div>
<input class="sr-only" name="otp_channel" type="radio" value="telegram"/>
</label>
</fieldset>
<!-- END: ChannelSelectionList -->
<!-- BEGIN: ActionButton -->
<div class="mt-6" data-purpose="submit-action">

            Send OTP

</div>
<!-- BEGIN: BottomHelpText -->
<footer class="mt-6 mb-8 text-center" data-purpose="info-notice">
<div class="flex items-start justify-center text-xs text-slate-500 leading-relaxed px-2">

<path d="M12 16v-4m0-4h.01" stroke-linecap="round" stroke-width="1.8"></path>
</svg>
<span class="text-left">Didn't receive it? You can try a different method.</span>
</div>
</footer>
<!-- END: BottomHelpText -->
</div>
<!-- iOS Home Indicator -->
<div class="w-full pb-2 flex justify-center shrink-0">
<div class="w-32 h-1 bg-slate-300 rounded-full"></div>
</div>
</main>
<!-- END: MobileDeviceContainer -->
<!-- BEGIN: InteractiveRadioHandler -->
<script data-purpose="radio-selection-logic">
    document.addEventListener('DOMContentLoaded', () => {
      const labels = document.querySelectorAll('fieldset[data-purpose="otp-channel-options"] label');

      labels.forEach(label => {
        label.addEventListener('click', () => {
          // Reset all options to unselected UI
          labels.forEach(l => {
            l.classList.remove('border-emerald-500', 'bg-emerald-50/20');
            l.classList.add('border-slate-200', 'bg-white');
            
            const radioIcon = l.querySelector('input[type="radio"]').previousElementSibling;
            radioIcon.className = 'w-5 h-5 rounded-full border-2 border-slate-300 shrink-0';
            radioIcon.innerHTML = '';
          });

          // Set clicked option to selected UI
          label.classList.remove('border-slate-200', 'bg-white');
          label.classList.add('border-emerald-500', 'bg-emerald-50/20');
          
          const activeRadio = label.querySelector('input[type="radio"]').previousElementSibling;
          activeRadio.className = 'w-5 h-5 rounded-full bg-emerald-600 flex items-center justify-center shrink-0';
          activeRadio.innerHTML = `
            <svg class="w-3 h-3 text-white stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          `;
          
          const radioInput = label.querySelector('input[type="radio"]');
          radioInput.checked = true;
        });
      });
    });
  </script>
<!-- END: InteractiveRadioHandler -->
</body></html>
