<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Linked Accounts</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#15803d',
              600: '#00875a',
              700: '#006c48',
              800: '#065f46',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<style data-purpose="custom-ios-styles">
    /* iOS specific styling tweaks */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .status-bar-height {
      height: 44px;
    }
    .home-indicator-height {
      height: 34px;
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-0 sm:p-4 text-slate-800 antialiased font-sans">
<!-- BEGIN: PhoneFrameContainer -->
<!-- Mimicking iOS mobile screen container -->
<div class="w-full max-w-[390px] h-[844px] bg-white sm:rounded-[48px] shadow-2xl overflow-hidden flex flex-col relative border border-slate-200" data-purpose="mobile-screen-wrapper">
<!-- BEGIN: iOSStatusBar -->
<div class="status-bar-height w-full px-7 flex justify-between items-center text-xs font-semibold text-slate-800 z-10 shrink-0 pt-2" data-purpose="ios-status-bar">
<!-- Time -->
<span class="tracking-tight text-sm font-semibold">9:41</span>
<!-- System Icons -->
<div class="flex items-center space-x-1.5">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3 fill-current" viewbox="0 0 17 11">
<rect height="3" rx="0.5" width="2.5" x="0" y="8"></rect>
<rect height="5.5" rx="0.5" width="2.5" x="4" y="5.5"></rect>
<rect height="8" rx="0.5" width="2.5" x="8" y="3"></rect>
<rect height="11" rx="0.5" width="2.5" x="12" y="0"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 12a1.5 1.5 0 100-3 1.5 1.5 0 000 3zm5.07-5.5a7.2 7.2 0 00-10.14 0l-1.4-1.4a9.2 9.2 0 0112.94 0l-1.4 1.4zm2.83-2.83a11.2 11.2 0 00-15.8 0L-1.5 2.27a13.2 13.2 0 0118.6 0l-1.4 1.4z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-current rounded-sm p-0.5 flex items-center relative">
<div class="h-full bg-current rounded-2xs w-3/4"></div>
<div class="absolute -right-1 top-0.5 w-0.5 h-1.5 bg-current rounded-r-xs"></div>
</div>
</div>
</div>
<!-- END: iOSStatusBar -->
<!-- BEGIN: TopNavigation -->
<header class="px-4 py-3 flex items-center relative border-b border-slate-100 shrink-0" data-purpose="screen-header">
<!-- Back Arrow Button -->
<button aria-label="Go back" class="p-1 -ml-1 text-slate-700 hover:text-slate-900 rounded-full focus:outline-none transition" type="button">
<svg class="w-6 h-6 stroke-[2.2] stroke-current fill-none" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Screen Title -->
<h1 class="flex-1 text-center font-bold text-base text-slate-800 pr-5">
        Linked Accounts
      </h1>
</header>
<!-- END: TopNavigation -->
<!-- BEGIN: MainContent -->
<main class="flex-1 px-5 pt-6 pb-4 overflow-y-auto flex flex-col justify-between" data-purpose="linked-accounts-content">
<!-- Accounts List Section -->
<section class="space-y-4" data-purpose="account-items">
<!-- Account Card 1: Google -->
<article class="border border-slate-200 rounded-2xl p-4 flex items-center justify-between shadow-xs bg-white" data-purpose="account-card-google">
<div class="flex items-center space-x-3.5">
<!-- Google Logo Icon -->
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-50 border border-slate-100 shrink-0">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.94 0 12s.45 3.84 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
</div>
<div>
<h2 class="text-sm font-semibold text-slate-800 leading-snug">Google</h2>
<p class="text-xs text-slate-500 font-normal">rohit@gmail.com</p>
</div>
</div>
<!-- Status Badge -->
<span class="inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-medium bg-emerald-50 text-emerald-700 border border-emerald-100">
            Connected
          </span>
</article>
<!-- Account Card 2: Phone -->
<article class="border border-slate-200 rounded-2xl p-4 flex items-center justify-between shadow-xs bg-white" data-purpose="account-card-phone">
<div class="flex items-center space-x-3.5">
<!-- Phone Icon -->
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-emerald-50 border border-emerald-100 text-emerald-600 shrink-0">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.25.2 2.45.57 3.57a1 1 0 01-.25 1.02l-2.2 2.2z"></path>
</svg>
</div>
<div>
<h2 class="text-sm font-semibold text-slate-800 leading-snug">Phone</h2>
<p class="text-xs text-slate-500 font-normal">+91 9876543210</p>
</div>
</div>
<!-- Status Badge -->
<span class="inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-medium bg-emerald-50 text-emerald-700 border border-emerald-100">
            Verified
          </span>
</article>
<!-- Account Card 3: Email -->
<article class="border border-slate-200 rounded-2xl p-4 flex items-center justify-between shadow-xs bg-white" data-purpose="account-card-email">
<div class="flex items-center space-x-3.5">
<!-- Email Icon -->
<div class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-100 border border-slate-200 text-slate-600 shrink-0">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"></path>
</svg>
</div>
<div>
<h2 class="text-sm font-semibold text-slate-800 leading-snug">Email</h2>
<p class="text-xs text-slate-500 font-normal leading-tight">rohit@example.com</p>
<p class="text-[11px] text-red-500 font-normal mt-0.5">Not verified</p>
</div>
</div>
<!-- Verify Action Button -->
<button class="inline-flex items-center px-3 py-1 rounded-lg text-xs font-semibold bg-emerald-700 hover:bg-emerald-800 text-white shadow-sm transition active:scale-95" type="button">
            Verify
          </button>
</article>
<!-- Action: Add Another Method -->
<div class="pt-4 text-center">
<button class="inline-flex items-center text-sm font-semibold text-emerald-700 hover:text-emerald-800 space-x-1.5 focus:outline-none transition group" type="button">
<span class="text-base font-bold transition group-hover:scale-110">+</span>
<span>Add another method</span>
</button>
</div>
</section>
<!-- Bottom Explanatory Footnote -->
<footer class="mt-auto pb-4 pt-6 text-center" data-purpose="recovery-footnote">
<p class="text-xs text-slate-500 max-w-[270px] mx-auto leading-relaxed">
          Having multiple methods helps you recover your account easily.
        </p>
</footer>
</main>
<!-- END: MainContent -->
<!-- BEGIN: iOSHomeIndicator -->
<div class="home-indicator-height w-full flex items-center justify-center shrink-0" data-purpose="ios-home-indicator">
<div class="w-32 h-1 bg-slate-900 rounded-full"></div>
</div>
<!-- END: iOSHomeIndicator -->
</div>
<!-- END: PhoneFrameContainer -->
</body></html>
