<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Scheme App - AI Processing</title>
<!-- Tailwind CSS v3 CDN with Forms and Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#15803d',
              600: '#166534',
              700: '#14532d',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-animations">
    @keyframes spin-slow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin-slow 1.6s linear infinite;
    }
  </style>
<style data-purpose="layout-adjustments">
    /* Prevent rubber banding on iOS Safari wrapper */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-0 md:p-6 font-sans antialiased text-slate-800">
<!-- BEGIN: MobileDeviceContainer -->
<main class="w-full max-w-[390px] h-[844px] bg-white md:rounded-[44px] shadow-2xl flex flex-col relative overflow-hidden border border-slate-200" data-purpose="mobile-frame">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full h-11 pt-3 px-6 flex justify-between items-center bg-white shrink-0 z-20" data-purpose="status-bar">
<!-- Time -->
<span class="text-[15px] font-semibold text-slate-900 tracking-tight">9:41</span>
<!-- Cellular, Wifi, Battery indicators -->
<div class="flex items-center space-x-2 text-slate-900">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-3 fill-current" fill="none" viewbox="0 0 17 11" xmlns="http://www.w3.org/2000/svg">
<rect height="3" rx="0.75" width="3" x="0" y="8"></rect>
<rect height="5.5" rx="0.75" width="3" x="4.6" y="5.5"></rect>
<rect height="8" rx="0.75" width="3" x="9.3" y="3"></rect>
<rect height="11" rx="0.75" width="3" x="14" y="0"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-3.5 fill-current" fill="none" viewbox="0 0 16 12" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M8 2.5C10.7 2.5 13.1 3.6 14.8 5.4L16 4.2C13.9 2 11.1 0.7 8 0.7C4.9 0.7 2.1 2 0 4.2L1.2 5.4C2.9 3.6 5.3 2.5 8 2.5ZM8 6.5C9.7 6.5 11.2 7.2 12.3 8.3L13.5 7.1C12.1 5.7 10.1 4.8 8 4.8C5.9 4.8 3.9 5.7 2.5 7.1L3.7 8.3C4.8 7.2 6.3 6.5 8 6.5ZM8 10C9 10 9.8 10.8 9.8 11.8H6.2C6.2 10.8 7 10 8 10Z" fill-rule="evenodd"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 border border-slate-900 rounded-[4px] p-0.5 flex items-center relative">
<div class="w-full h-full bg-slate-900 rounded-[1.5px]"></div>
<div class="w-0.5 h-1.5 bg-slate-900 absolute -right-1 rounded-r-sm"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: AppHeader -->
<section class="h-14 px-4 border-b border-slate-100 flex items-center justify-between bg-white shrink-0 z-10" data-purpose="app-header">
<!-- Left: Logo & Status -->
<div class="flex items-center space-x-2.5">
<div class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center shadow-sm">
<!-- Leaf emblem -->
<svg class="w-4 h-4 text-white" fill="currentColor" viewbox="0 0 24 24">
<path d="M17.5 2C13 2 9 5.5 8.5 10.5C8 15 11 18.5 15.5 19C15.8 19 16.2 19 16.5 19C20.5 18.5 22.5 14.5 22.5 10C22.5 5.5 20.5 2 17.5 2ZM15.8 17.2C12.4 16.8 10.2 13.9 10.5 10.3C10.9 6.2 14.1 3.8 17.3 3.8C19.2 3.8 20.8 6.4 20.8 9.9C20.8 13.5 19.1 16.9 15.8 17.2Z"></path>
<path d="M7 13.5C6.3 12.8 5.2 12.5 4.2 12.8C2.5 13.2 1.5 15 1.5 17.2C1.5 19.8 3.5 22 6 22C7.5 22 8.9 21.2 9.7 20C10.4 19 10.2 17.5 9.3 16.5L7 13.5Z"></path>
</svg>
</div>
<div>
<h1 class="text-sm font-bold text-slate-800 leading-tight">Scheme App</h1>
<div class="flex items-center space-x-1">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
<span class="text-[11px] text-emerald-600 font-medium leading-none">Online</span>
</div>
</div>
</div>
<!-- Right: Notification Bell & Profile Avatar -->
<div class="flex items-center space-x-3">
<button aria-label="Notifications" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-50 relative" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- User Avatar with Green Headscarf / Indian Woman Style from Screenshot -->
<div class="w-8 h-8 rounded-full ring-2 ring-emerald-500/20 overflow-hidden bg-amber-100 flex items-center justify-center">
<svg class="w-full h-full text-slate-400" fill="none" viewbox="0 0 32 32">
<circle cx="16" cy="16" fill="#FDE68A" r="16"></circle>
<!-- Hair & Veil -->
<path d="M8 12C8 7.58 11.58 4 16 4C20.42 4 24 7.58 24 12V20C24 20 22 23 16 23C10 23 8 20 8 20V12Z" fill="#047857"></path>
<!-- Face -->
<circle cx="16" cy="14" fill="#D97706" r="5"></circle>
<!-- Bindi & Features -->
<circle cx="16" cy="12.5" fill="#DC2626" r="0.8"></circle>
<!-- Torso / Sari -->
<path d="M7 32C7 26 11 23 16 23C21 23 25 26 25 32H7Z" fill="#059669"></path>
<path d="M12 23L19 32" stroke="#F59E0B" stroke-width="1.5"></path>
</svg>
</div>
</div>
</section>
<!-- END: AppHeader -->
<!-- BEGIN: ChatScrollArea -->
<section class="flex-1 overflow-y-auto px-4 py-4 space-y-4 bg-slate-50/60" data-purpose="chat-messages-container">
<!-- User Query Message Bubble (Right-aligned) -->
<div class="flex justify-end w-full" data-purpose="user-message">
<div class="max-w-[82%] bg-[#E8F5E9] border border-[#C8E6C9] rounded-2xl rounded-tr-xs p-3.5 shadow-sm">
<p class="text-[13.5px] leading-snug text-slate-800 font-normal">
            I am a farmer and I want to know about schemes for drip irrigation.
          </p>
<div class="flex items-center justify-end space-x-1 mt-1.5 text-[10px] text-emerald-700">
<span>10:24 AM</span>
<!-- Green Single Checkmark -->
<svg class="w-3.5 h-3.5 text-emerald-600" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M16.704 4.153a.75.75 0 01.143 1.052l-8 10.5a.75.75 0 01-1.127.075l-4.5-4.5a.75.75 0 011.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 011.05-.143z" fill-rule="evenodd"></path>
</svg>
</div>
</div>
</div>
<!-- AI "Thinking..." State Card -->
<div class="flex items-start space-x-2.5 w-full pt-1" data-purpose="ai-processing-state">
<!-- AI Robot Avatar -->
<div class="w-7 h-7 rounded-full bg-emerald-600 flex items-center justify-center shrink-0 mt-0.5 shadow-sm text-white">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<!-- Robot Head Icon -->
<rect height="12" rx="3" stroke-width="1.8" width="16" x="4" y="8"></rect>
<path d="M12 4v4m-3-4h6" stroke-linecap="round" stroke-width="1.8"></path>
<circle cx="9" cy="13" fill="currentColor" r="1.2"></circle>
<circle cx="15" cy="13" fill="currentColor" r="1.2"></circle>
<path d="M9 17h6" stroke-linecap="round" stroke-width="1.5"></path>
</svg>
</div>
<!-- Card Container -->
<div class="flex-1 bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 space-y-3.5">
<!-- Thinking Title -->
<h2 class="text-[14.5px] font-bold text-slate-800 tracking-tight">Thinking...</h2>
<!-- Steps Progress List -->
<ul class="space-y-3" data-purpose="checklist">
<!-- Step 1: Completed -->
<li class="flex items-center space-x-2.5">
<span class="w-5 h-5 rounded-full bg-emerald-600 flex items-center justify-center shrink-0">
<svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<span class="text-[13px] text-slate-600 font-medium">Understanding your query</span>
</li>
<!-- Step 2: Completed -->
<li class="flex items-center space-x-2.5">
<span class="w-5 h-5 rounded-full bg-emerald-600 flex items-center justify-center shrink-0">
<svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<span class="text-[13px] text-slate-600 font-medium">Finding relevant schemes</span>
</li>
<!-- Step 3: Completed -->
<li class="flex items-center space-x-2.5">
<span class="w-5 h-5 rounded-full bg-emerald-600 flex items-center justify-center shrink-0">
<svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<span class="text-[13px] text-slate-600 font-medium">Checking eligibility criteria</span>
</li>
<!-- Step 4: Active / In Progress Spinner -->
<li class="flex items-center space-x-2.5">
<span class="w-5 h-5 rounded-full flex items-center justify-center shrink-0">
<!-- Half-filled spinning circle matching screenshot -->
<svg class="w-4 h-4 text-emerald-600 animate-spin-slow" fill="none" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9" stroke="#CBD5E1" stroke-width="3"></circle>
<path d="M12 3C16.9706 3 21 7.02944 21 12" stroke="currentColor" stroke-linecap="round" stroke-width="3"></path>
</svg>
</span>
<span class="text-[13px] text-slate-400 font-normal">Preparing recommendations</span>
</li>
</ul>
<!-- Bottom Amber Banner / Tip Notice -->
<div class="mt-3 pt-2.5 border-t border-slate-100 flex items-start space-x-2" data-purpose="processing-tip">
<!-- Lightbulb icon with subtle glow -->
<span class="text-amber-500 text-sm leading-none shrink-0 pt-0.5">💡</span>
<p class="text-[11.5px] leading-relaxed text-slate-500 font-normal">
              This usually takes a few seconds. Please wait...
            </p>
</div>
</div>
</div>
</section>
<!-- END: ChatScrollArea -->
<!-- BEGIN: ChatInputField -->
<section class="p-3 bg-white border-t border-slate-100 shrink-0" data-purpose="chat-input-bar">
<div class="flex items-center bg-white border border-slate-200 rounded-full px-4 py-2 shadow-xs">
<input class="flex-1 bg-transparent text-[13.5px] text-slate-700 placeholder-slate-400 outline-none border-none focus:ring-0 p-0" disabled="" placeholder="Type your message..." type="text"/>
<!-- Attachment Icon (Paperclip) -->
<button aria-label="Attach Document" class="p-1 text-slate-400 hover:text-slate-600 focus:outline-none" type="button">
<svg class="w-4 h-4 rotate-45" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Voice / Microphone Icon Button -->
<button aria-label="Voice Input" class="w-8 h-8 rounded-full bg-emerald-600 text-white flex items-center justify-center ml-2 shadow-sm shrink-0" type="button">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M19 10v1a7 7 0 01-14 0v-1M12 18v4M8 22h8" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</section>
<!-- END: ChatInputField -->
<!-- BEGIN: BottomNavigation -->
<nav class="h-16 border-t border-slate-100 bg-white flex items-center justify-around px-2 shrink-0 pb-1" data-purpose="bottom-nav">
<!-- Tab 1: Advisor (Active) -->
<button aria-selected="true" class="flex flex-col items-center justify-center flex-1 py-1 text-emerald-700 font-semibold" type="button">
<svg class="w-5 h-5 mb-1" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 2C6.48 2 2 6.48 2 12c0 1.82.49 3.53 1.34 5L2 22l5.14-1.31C8.58 21.49 10.24 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"></path>
</svg>
<span class="text-[10.5px] tracking-tight">Advisor</span>
</button>
<!-- Tab 2: Vault -->
<button class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-slate-600" type="button">
<svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10.5px] tracking-tight font-medium">Vault</span>
</button>
<!-- Tab 3: Check -->
<button class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-slate-600" type="button">
<svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10.5px] tracking-tight font-medium">Check</span>
</button>
<!-- Tab 4: Schemes -->
<button class="flex flex-col items-center justify-center flex-1 py-1 text-slate-400 hover:text-slate-600" type="button">
<svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[10.5px] tracking-tight font-medium">Schemes</span>
</button>
</nav>
<!-- END: BottomNavigation -->
<!-- Home Indicator (iOS Home Bar) -->
<div class="w-full flex justify-center pb-1.5 pt-0.5 bg-white shrink-0">
<div class="w-32 h-1 bg-slate-300 rounded-full"></div>
</div>
</main>
<!-- END: MobileDeviceContainer -->
</body></html>
