<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Edit Profile - Scheme App</title>
<!-- Tailwind CSS v3 CDN with forms plugin -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#0B6547', // Scheme green brand color
              dark: '#084f37',
              light: '#e8f5ef'
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-resets">
    /* iOS smooth tap highlight and container constraints */
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 bg-slate-100">
<!-- BEGIN: MobileDeviceFrame -->
<main class="w-full max-w-[390px] h-[844px] bg-white sm:rounded-[44px] shadow-2xl flex flex-col justify-between relative overflow-hidden border border-gray-200" data-purpose="mobile-screen-container">
<!-- Screen Content Wrapper -->
<div class="flex flex-col flex-1 overflow-y-auto">
<!-- BEGIN: StatusBar -->
<header class="w-full px-7 pt-3.5 pb-2 flex justify-between items-center text-black font-semibold text-xs select-none tracking-tight">
<span class="text-[15px] font-semibold">9:41</span>
<div class="flex items-center space-x-2">
<!-- Signal Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M1 10h2V2H1v8zm4 0h2V5H5v5zm4 0h2V0H9v10zm4 0h2V7h-2v3z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.5C5.2 2.5 2.7 3.6 1 5.4l1.4 1.4C3.7 5.4 5.7 4.5 8 4.5s4.3.9 5.6 2.3L15 5.4C13.3 3.6 10.8 2.5 8 2.5zm0 4c-1.7 0-3.2.7-4.2 1.8L8 12.5l4.2-4.2C11.2 7.2 9.7 6.5 8 6.5z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-black rounded-sm p-0.5 flex items-center">
<div class="h-full w-full bg-black rounded-2xs"></div>
</div>
</div>
</header>
<!-- END: StatusBar -->
<!-- BEGIN: NavigationBar -->
<nav aria-label="Page Header" class="relative flex items-center justify-between px-4 py-3 border-b border-gray-50">
<button aria-label="Go back" class="p-2 -ml-2 text-gray-700 hover:text-gray-900 transition-colors" type="button">
<!-- Back Chevron -->
<svg class="w-5 h-5 stroke-current stroke-[2.5]" fill="none" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24">
<polyline points="15 18 9 12 15 6"></polyline>
</svg>
</button>
<h1 class="text-base font-bold text-gray-900 tracking-tight absolute left-1/2 -translate-x-1/2">Edit Profile</h1>
<div class="w-7"></div> <!-- Placeholder to balance header -->
</nav>
<!-- END: NavigationBar -->
<!-- BEGIN: ProfileFormSection -->
<div class="px-5 pt-5 pb-6">
<!-- Avatar with Camera Badge -->
<div class="flex flex-col items-center justify-center mb-6">
<div class="relative group cursor-pointer" data-purpose="avatar-uploader">
<!-- Circular Avatar Image Container -->
<div class="w-20 h-20 rounded-full border-2 border-primary/20 p-0.5 bg-emerald-50 flex items-center justify-center overflow-hidden">
<img alt="Profile photo of Rohit Kumar" class="w-full h-full rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBAaVljJiacmlNl48CBGy8hKBhTtk47sVDgTaGIYqzhlCSF6SuEggrIqMtvHDpP2U0ZWVNJRejFWwcgwkHP73uPESaxR37eUE6NUhJCTsFOkNGsEMvz-c-mZwD0SyN7-0YSNOxX5Js4m1E58RVe0D3C1eoornmBGuXB7pqeBXidiC1a4RD89ZHDYyhpETvk2RgvfqHQUidqKnrfyEs6zif_QmG1_MbMvQ9QcGrP9KsTw57AzZOPtzRe"/>
</div>
<!-- Edit Camera Icon Button Overlay -->
<button aria-label="Change profile photo" class="absolute bottom-0 right-0 w-6 h-6 bg-[#0B6547] text-white rounded-full flex items-center justify-center border-2 border-white shadow-sm hover:bg-emerald-800 transition-colors" type="button">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
<circle cx="12" cy="13" r="4"></circle>
</svg>
</button>
</div>
</div>
<!-- Form Fields -->
<form class="space-y-4" data-purpose="edit-profile-form" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div>
<label class="block text-xs font-semibold text-gray-600 mb-1" for="fullName">
              Full Name
            </label>
<input class="w-full h-11 px-3.5 text-sm text-gray-800 bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-[#0B6547] focus:border-[#0B6547]" id="fullName" name="fullName" placeholder="Enter your full name" type="text" value="Rohit Kumar"/>
</div>
<!-- Email Field -->
<div>
<label class="block text-xs font-semibold text-gray-600 mb-1" for="email">
              Email
            </label>
<input class="w-full h-11 px-3.5 text-sm text-gray-800 bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-[#0B6547] focus:border-[#0B6547]" id="email" name="email" placeholder="Enter your email" type="email" value="rohit@example.com"/>
</div>
<!-- Phone Number Field with Country Code and Verified Badge -->
<div>
<label class="block text-xs font-semibold text-gray-600 mb-1" for="phone">
              Phone Number
            </label>
<div class="relative flex items-center h-11 w-full bg-white border border-gray-200 rounded-lg overflow-hidden focus-within:ring-1 focus-within:ring-[#0B6547] focus-within:border-[#0B6547]">
<!-- Country Prefix -->
<div class="flex items-center pl-3 pr-2 text-xs font-medium text-gray-700 select-none border-r border-gray-100 space-x-1 cursor-default">
<span class="text-sm">🇮🇳</span>
<span>+91</span>
<svg class="w-3 h-3 text-gray-500 fill-current" viewbox="0 0 20 20">
<path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"></path>
</svg>
</div>
<!-- Input Number -->
<input class="flex-1 h-full px-3 text-sm text-gray-800 border-0 focus:ring-0 focus:outline-none" id="phone" name="phone" type="tel" value="9876543210"/>
<!-- Verified Tag -->
<div class="pr-3 flex items-center text-xs font-semibold text-emerald-600 space-x-1 select-none">
<svg class="w-3.5 h-3.5 stroke-current stroke-[2.5]" fill="none" viewbox="0 0 24 24">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
<span>Verified</span>
</div>
</div>
</div>
<!-- State Selection Dropdown -->
<div>
<label class="block text-xs font-semibold text-gray-600 mb-1" for="state">
              State
            </label>
<div class="relative">
<select class="appearance-none w-full h-11 px-3.5 text-sm text-gray-800 bg-white border border-gray-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-[#0B6547] focus:border-[#0B6547] pr-10" id="state" name="state">
<option selected="" value="Maharashtra">Maharashtra</option>
<option value="Delhi">Delhi</option>
<option value="Karnataka">Karnataka</option>
<option value="Gujarat">Gujarat</option>
<option value="Uttar Pradesh">Uttar Pradesh</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-gray-500">
<svg class="w-4 h-4 fill-current" viewbox="0 0 20 20">
<path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"></path>
</svg>
</div>
</div>
</div>
</form>
</div>
<!-- END: ProfileFormSection -->
</div>
<!-- BEGIN: BottomActionSection -->
<div class="p-5 pb-8 bg-white border-t border-gray-100" data-purpose="form-actions">
<button class="w-full h-12 bg-[#0B6547] hover:bg-[#084f37] active:scale-[0.99] text-white font-medium text-sm rounded-lg transition duration-150 flex items-center justify-center shadow-sm" type="button">
        Save Changes
      </button>
<!-- iOS Home Indicator -->
<div class="w-32 h-1 bg-gray-300 rounded-full mx-auto mt-4"></div>
</div>
<!-- END: BottomActionSection -->
</main>
<!-- END: MobileDeviceFrame -->
</body></html>
