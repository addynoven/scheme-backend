<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Step 2 of 3 - Economic Details | Scheme App</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-range-slider">
    /* Custom styles for range slider appearance */
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #047857;
      cursor: pointer;
      border: 2.5px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }
    input[type="range"]::-moz-range-thumb {
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #047857;
      cursor: pointer;
      border: 2.5px solid #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen font-sans antialiased text-slate-800 p-0 sm:p-4">
<!-- BEGIN: MobileFrame -->
<main class="w-full max-w-[400px] bg-white min-h-screen sm:min-h-[844px] sm:h-[844px] sm:rounded-[40px] shadow-2xl overflow-hidden flex flex-col justify-between border border-slate-200/80 relative">
<!-- Top content container -->
<div class="flex-1 flex flex-col overflow-y-auto">
<!-- BEGIN: StatusBar -->
<div class="pt-3 px-7 pb-2 flex justify-between items-center text-xs font-semibold text-slate-900 select-none">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<!-- Cellular bars -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z" opacity="0.3"></path>
<path d="M2 17h3v4H2v-4zm5-4h3v8H7v-8zm5-5h3v13h-3V8zm5-5h3v18h-3V3z"></path>
</svg>
<!-- Wifi -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.55 0 6.78 1.45 9.15 3.8L12 18.5 2.85 11.3C5.22 8.95 8.45 7.5 12 7.5z"></path>
</svg>
<!-- Battery -->
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M16 4H8v1.5H5C3.9 5.5 3 6.4 3 7.5v11C3 19.6 3.9 20.5 5 20.5h14c1.1 0 2-.9 2-2v-11c0-1.1-.9-2-2-2h-3V4zm3 14.5H5V7.5h14v11z"></path>
</svg>
</div>
</div>
<!-- END: StatusBar -->
<!-- BEGIN: HeaderSection -->
<header class="px-5 pt-2 pb-3">
<div class="flex items-center relative">
<!-- Back button -->
<button aria-label="Go back" class="p-1.5 -ml-1.5 rounded-full hover:bg-slate-100 text-slate-700 transition" type="button">
<svg class="w-5 h-5 stroke-current stroke-2" fill="none" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<div class="w-full text-center pr-6">
<span class="text-xs font-semibold text-emerald-800 tracking-wide uppercase">Step 2 of 3</span>
<h1 class="text-lg font-bold text-slate-900 leading-tight">Economic Details</h1>
<p class="text-xs text-slate-500 mt-0.5">Your work and income</p>
</div>
</div>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: Stepper -->
<section aria-label="Form Progress" class="px-8 py-2.5">
<div class="relative flex items-center justify-between">
<!-- Progress background line -->
<div class="absolute left-6 right-6 top-3.5 -translate-y-1/2 h-0.5 bg-slate-200 -z-0"></div>
<div class="absolute left-6 w-1/2 top-3.5 -translate-y-1/2 h-0.5 bg-emerald-700 -z-0"></div>
<!-- Step 1: Completed -->
<div class="flex flex-col items-center relative z-10">
<div class="w-7 h-7 rounded-full bg-emerald-700 text-white flex items-center justify-center shadow-sm">
<svg class="w-4 h-4 stroke-current stroke-[2.5]" fill="none" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[11px] font-medium text-slate-600 mt-1">Demographics</span>
</div>
<!-- Step 2: Active -->
<div class="flex flex-col items-center relative z-10">
<div class="w-7 h-7 rounded-full bg-emerald-800 text-white font-semibold text-xs flex items-center justify-center ring-4 ring-emerald-100 shadow-sm">
              2
            </div>
<span class="text-[11px] font-semibold text-emerald-900 mt-1">Economic</span>
</div>
<!-- Step 3: Inactive -->
<div class="flex flex-col items-center relative z-10">
<div class="w-7 h-7 rounded-full bg-slate-100 border border-slate-300 text-slate-400 font-semibold text-xs flex items-center justify-center">
              3
            </div>
<span class="text-[11px] font-medium text-slate-400 mt-1">Assets</span>
</div>
</div>
</section>
<!-- END: Stepper -->
<!-- BEGIN: FormBody -->
<form class="px-5 pt-3 pb-4 space-y-4" data-purpose="economic-details-form">
<!-- SECTION: Occupation -->
<div>
<label class="block text-xs font-semibold text-slate-800 mb-2">Occupation</label>
<div class="grid grid-cols-3 gap-2.5">
<!-- Farmer (Selected) -->
<button class="flex flex-col items-center justify-center p-2.5 rounded-xl border-2 border-emerald-600 bg-emerald-50/70 text-emerald-900 transition-all shadow-sm" type="button">
<div class="w-9 h-9 rounded-full bg-white flex items-center justify-center mb-1 text-emerald-700 shadow-xs">
<!-- Sprout/Leaf Icon -->
<svg class="w-5 h-5 stroke-current stroke-2" fill="none" viewbox="0 0 24 24">
<path d="M12 19V6m0 0a5 5 0 015 5v2a5 5 0 01-5-5zm0 0a5 5 0 00-5 5v2a5 5 0 005-5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-xs font-semibold">Farmer</span>
</button>
<!-- Student -->
<button class="flex flex-col items-center justify-center p-2.5 rounded-xl border border-slate-200 bg-white hover:border-slate-300 text-slate-700 transition-all" type="button">
<div class="w-9 h-9 rounded-full bg-slate-50 flex items-center justify-center mb-1 text-slate-600">
<!-- Academic Cap Icon -->
<svg class="w-5 h-5 stroke-current stroke-1.75" fill="none" viewbox="0 0 24 24">
<path d="M12 14l9-5-9-5-9 5 9 5z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-xs font-medium">Student</span>
</button>
<!-- Artisan -->
<button class="flex flex-col items-center justify-center p-2.5 rounded-xl border border-slate-200 bg-white hover:border-slate-300 text-slate-700 transition-all" type="button">
<div class="w-9 h-9 rounded-full bg-slate-50 flex items-center justify-center mb-1 text-slate-600">
<!-- Paint Palette / Craft Icon -->
<svg class="w-5 h-5 stroke-current stroke-1.75" fill="none" viewbox="0 0 24 24">
<path d="M7 21a4 4 0 01-4-4 11.5 11.5 0 0115.5-10.7A5 5 0 0121 11a5 5 0 01-5 5h-2.5a2.5 2.5 0 00-2.5 2.5 2.5 2.5 0 01-2.5 2.5H7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-xs font-medium">Artisan</span>
</button>
<!-- Salaried -->
<button class="flex flex-col items-center justify-center p-2.5 rounded-xl border border-slate-200 bg-white hover:border-slate-300 text-slate-700 transition-all" type="button">
<div class="w-9 h-9 rounded-full bg-slate-50 flex items-center justify-center mb-1 text-slate-600">
<!-- Briefcase Icon -->
<svg class="w-5 h-5 stroke-current stroke-1.75" fill="none" viewbox="0 0 24 24">
<path d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-xs font-medium">Salaried</span>
</button>
<!-- Self Employed -->
<button class="flex flex-col items-center justify-center p-2.5 rounded-xl border border-slate-200 bg-white hover:border-slate-300 text-slate-700 transition-all" type="button">
<div class="w-9 h-9 rounded-full bg-slate-50 flex items-center justify-center mb-1 text-slate-600">
<!-- Storefront Icon -->
<svg class="w-5 h-5 stroke-current stroke-1.75" fill="none" viewbox="0 0 24 24">
<path d="M3 3h18v4a3 3 0 01-3 3 3 3 0 01-3-3 3 3 0 01-3 3 3 3 0 01-3-3 3 3 0 01-3 3 3 3 0 01-3-3V3z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M4 10v10a1 1 0 001 1h14a1 1 0 001-1V10" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M9 21V13h6v8" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-xs font-medium leading-tight text-center">Self Employed</span>
</button>
<!-- Unemployed -->
<button class="flex flex-col items-center justify-center p-2.5 rounded-xl border border-slate-200 bg-white hover:border-slate-300 text-slate-700 transition-all" type="button">
<div class="w-9 h-9 rounded-full bg-slate-50 flex items-center justify-center mb-1 text-slate-600">
<!-- Person Outline Icon -->
<svg class="w-5 h-5 stroke-current stroke-1.75" fill="none" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-xs font-medium">Unemployed</span>
</button>
</div>
</div>
<!-- SECTION: Category -->
<div class="pt-1">
<label class="block text-xs font-semibold text-slate-800 mb-2">Category</label>
<div class="grid grid-cols-4 gap-2">
<!-- General (Selected) -->
<button class="flex items-center justify-center py-2 px-1 rounded-full bg-emerald-800 text-white font-semibold text-xs shadow-xs space-x-1" type="button">
<svg class="w-3.5 h-3.5 stroke-current stroke-[2.5]" fill="none" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>General</span>
</button>
<!-- OBC -->
<button class="py-2 px-1 rounded-full border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-medium text-xs text-center" type="button">
              OBC
            </button>
<!-- SC -->
<button class="py-2 px-1 rounded-full border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-medium text-xs text-center" type="button">
              SC
            </button>
<!-- ST -->
<button class="py-2 px-1 rounded-full border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-medium text-xs text-center" type="button">
              ST
            </button>
</div>
</div>
<!-- SECTION: Annual Income -->
<div class="pt-1 bg-slate-50/60 p-3.5 rounded-2xl border border-slate-100">
<div class="flex items-center justify-between mb-2">
<label class="text-xs font-semibold text-slate-800">Annual Income <span class="font-normal text-slate-500">(₹ per year)</span></label>
<div class="bg-white border border-slate-200/90 rounded-lg px-2.5 py-1 shadow-xs">
<span class="text-xs font-bold text-slate-900">₹1,20,000</span>
</div>
</div>
<!-- Slider component -->
<div class="px-1 py-2">
<input class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-700 focus:outline-none" max="1000000" min="0" step="10000" type="range" value="120000"/>
<!-- Ticks / Step labels -->
<div class="flex justify-between items-center text-[10px] text-slate-400 font-medium mt-2 px-0.5">
<span>0</span>
<span>1L</span>
<span>2.5L</span>
<span>5L</span>
<span>10L+</span>
</div>
</div>
</div>
</form>
<!-- END: FormBody -->
</div>
<!-- BEGIN: ActionButtonFooter -->
<div class="p-5 pt-2 pb-6 bg-white border-t border-slate-100 sm:rounded-b-[40px]">
<button class="w-full py-3.5 px-6 rounded-xl bg-emerald-800 hover:bg-emerald-900 active:scale-[0.99] text-white font-medium text-sm flex items-center justify-center space-x-2 shadow-md shadow-emerald-900/10 transition-all duration-150" type="button">
<span>Next: Assets &amp; Others</span>
<svg class="w-4 h-4 stroke-current stroke-2" fill="none" viewbox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- iOS Home Bar Indicator -->
<div class="w-32 h-1 bg-slate-300 rounded-full mx-auto mt-4"></div>
</div>
<!-- END: ActionButtonFooter -->
</main>
<!-- END: MobileFrame -->
</body></html>
