<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Scheme App - Open Auth Screen</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#0E6245',
              dark: '#0a4933'
            },
            surface: '#F8FAF9',
            borderLight: '#E5E7EB',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          boxShadow: {
            'ios-card': '0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02)',
            'button': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
          }
        }
      }
    }
  </script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-ios-fixes">
    /* Disable bounce scroll and configure iOS screen fit */
    html, body {
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .safe-top {
      padding-top: env(safe-area-inset-top, 14px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen text-gray-800 antialiased p-0 sm:p-4">
<!-- BEGIN: MobileDeviceFrame -->
<div class="w-full max-w-[390px] h-[844px] max-h-screen bg-white sm:rounded-[44px] shadow-2xl flex flex-col overflow-hidden relative border border-gray-200" data-purpose="iphone-container">
<!-- BEGIN: iOSStatusBar -->
<header class="safe-top px-7 pt-3 pb-1 flex justify-between items-center z-30 bg-transparent" data-purpose="status-bar">
<!-- Time -->
<span class="text-[15px] font-semibold tracking-tight text-gray-900">9:41</span>
<!-- Dynamic Island / Speaker Notch Space Mockup -->
<div class="w-28 h-4 bg-transparent"></div>
<!-- System Icons -->
<div class="flex items-center space-x-1.5 text-gray-900">
<!-- Cellular Signal -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25c-.2.2-.2.51 0 .71.2.2.51.2.71 0l.64-.64C7.23 19.46 9.49 20.2 12 20.2s4.77-.74 6.3-1.88l.64.64c.1.1.23.15.35.15s.26-.05.35-.15c.2-.2.2-.51 0-.71l-.62-.64C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 15.2c-3.42 0-6.2-2.78-6.2-6.2s2.78-6.2 6.2-6.2 6.2 2.78 6.2 6.2-2.78 6.2-6.2 6.2z"></path>
<circle cx="12" cy="12" r="3"></circle>
</svg>
<!-- Wi-Fi -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.55 0 6.78 1.41 9.17 3.7L12 19.38 2.83 11.2C5.22 8.91 8.45 7.5 12 7.5z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 border border-gray-900 rounded-sm p-[1px] flex items-center relative">
<div class="h-full bg-gray-900 rounded-2xs w-4/5"></div>
<div class="absolute -right-1 w-0.5 h-1.5 bg-gray-900 rounded-r-xs"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- Scrollable Content View -->
<main class="flex-1 overflow-y-auto px-6 pt-1 pb-4 flex flex-col justify-between" data-purpose="auth-screen-content">
<div>
<!-- BEGIN: AppBrandingHeader -->
<div class="flex items-center space-x-2.5 mt-1 mb-3" data-purpose="brand-header">
<!-- Leaf Logo -->
<div class="w-7 h-7 flex items-center justify-center">
<svg class="w-7 h-7 text-brand-900" fill="currentColor" viewbox="0 0 24 24">
<path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22l1-2.3A4.49,4.49,0,0,0,8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25V8.5C12,7.75 16,7.5 17,8Z"></path>
</svg>
</div>
<!-- Title & Subtitle -->
<div class="flex flex-col">
<span class="text-base font-bold text-gray-900 tracking-tight leading-tight">Scheme App</span>
<span class="text-[11px] text-gray-500 font-medium leading-none mt-0.5">Sarkar ki yojana, aapke liye</span>
</div>
</div>
<!-- END: AppBrandingHeader -->
<!-- BEGIN: HeroIllustrationCard -->
<div class="w-full rounded-2xl bg-[#F0FDF4] border border-emerald-100 overflow-hidden relative flex flex-col items-center pt-3 pb-2 shadow-sm mb-4" data-purpose="hero-banner">
<!-- Stylized Scenic Background Backdrop -->
<div class="absolute inset-0 bg-gradient-to-b from-[#E8F8F0] via-[#E1F7EC] to-[#C8EEDC] pointer-events-none"></div>
<!-- Illustration SVG of diverse Indian citizens -->
<div class="relative z-10 w-full h-36 flex items-end justify-center px-4">
<!-- Village scenery + Sun background elements -->
<svg class="w-full h-full" fill="none" viewbox="0 0 320 144" xmlns="http://www.w3.org/2000/svg">
<!-- Golden soft sun -->
<circle cx="160" cy="50" fill="#FEF08A" fill-opacity="0.6" r="28"></circle>
<!-- Distant hills/fields -->
<path d="M-20 144 C40 100, 100 110, 160 95 C220 80, 280 110, 340 144 Z" fill="#A7F3D0" fill-opacity="0.8"></path>
<path d="M-10 144 C60 115, 120 125, 180 115 C240 105, 300 125, 330 144 Z" fill="#6EE7B7" fill-opacity="0.7"></path>
<!-- Central Farmer Figure with Orange/Saffron Turban -->
<g id="farmer-father">
<!-- Turban -->
<ellipse cx="140" cy="52" fill="#F97316" rx="16" ry="12"></ellipse>
<path d="M125 54 Q140 42 155 54 Q140 62 125 54Z" fill="#EA580C"></path>
<!-- Face -->
<circle cx="140" cy="62" fill="#D97706" r="10"></circle>
<!-- Mustache -->
<path d="M135 66 Q140 68 145 66" stroke="#451A03" stroke-linecap="round" stroke-width="1.5"></path>
<!-- Kurta/Body -->
<path d="M124 74 C124 74, 131 71, 140 71 C149 71, 156 74, 156 74 L160 144 L120 144 Z" fill="#FFFFFF"></path>
<path d="M132 72 L137 92 L143 92 L148 72" stroke="#E5E7EB" stroke-width="1.5"></path>
</g>
<!-- Indian Woman in Blue Saree (Right) -->
<g id="woman-saree">
<!-- Hair Bun & Pallu -->
<circle cx="195" cy="56" fill="#1E293B" r="12"></circle>
<!-- Face -->
<circle cx="193" cy="63" fill="#B45309" r="9"></circle>
<!-- Bindi -->
<circle cx="193" cy="60" fill="#DC2626" r="1.2"></circle>
<!-- Saree Drape -->
<path d="M182 72 C182 72, 192 70, 204 72 C210 74, 216 82, 216 100 L216 144 L176 144 Z" fill="#0284C7"></path>
<path d="M184 72 Q194 90 198 144" stroke="#FBBF24" stroke-width="2.5"></path>
</g>
<!-- Young Boy / Student (Left) -->
<g id="young-student">
<!-- Hair -->
<ellipse cx="95" cy="74" fill="#1E293B" rx="10" ry="8"></ellipse>
<!-- Face -->
<circle cx="95" cy="80" fill="#D97706" r="8"></circle>
<!-- Shirt -->
<path d="M82 89 C82 89, 90 87, 95 87 C100 87, 108 89, 108 89 L112 144 L78 144 Z" fill="#FACC15"></path>
</g>
<!-- Young Woman / Student with modern attire -->
<g id="student-girl">
<!-- Hair -->
<ellipse cx="168" cy="68" fill="#1E293B" rx="11" ry="11"></ellipse>
<!-- Face -->
<circle cx="168" cy="75" fill="#C2410C" r="8"></circle>
<!-- Kurti -->
<path d="M156 84 C156 84, 164 82, 168 82 C172 82, 180 84, 180 84 L184 144 L152 144 Z" fill="#E11D48"></path>
</g>
</svg>
</div>
</div>
<!-- END: HeroIllustrationCard -->
<!-- BEGIN: HeroHeadlineSection -->
<div class="text-center mb-5" data-purpose="hero-headline">
<h1 class="text-[17px] font-bold text-gray-900 tracking-tight">
            A Brighter Tomorrow<br/>For Every Citizen
          </h1>
<!-- Tri-color Progress/Indicator Dots -->
<div aria-hidden="true" class="flex items-center justify-center space-x-1.5 mt-2.5">
<span class="w-1.5 h-1.5 rounded-full bg-orange-500"></span>
<span class="w-1.5 h-1.5 rounded-full bg-brand-900"></span>
<span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>
</div>
</div>
<!-- END: HeroHeadlineSection -->
<!-- BEGIN: AuthSegmentedTabs -->
<div class="border-b border-gray-200 mb-5" data-purpose="auth-tabs">
<div class="grid grid-cols-2 text-center text-sm font-semibold">
<!-- Login Tab (Active) -->
<button class="pb-2.5 border-b-2 border-brand-900 text-brand-900 flex justify-center items-center" type="button">
              Login
            </button>
<!-- Sign Up Tab -->
<button class="pb-2.5 border-b-2 border-transparent text-gray-400 hover:text-gray-600 flex justify-center items-center" type="button">
              Sign Up
            </button>
</div>
</div>
<!-- END: AuthSegmentedTabs -->
<!-- BEGIN: ActionButtonsGroup -->
<div class="space-y-3" data-purpose="login-options">
<!-- Primary: Continue with Google -->
<button class="w-full flex items-center justify-center space-x-3 py-3 px-4 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 active:scale-[0.99] transition-all shadow-sm" type="button">
<!-- Google Logo SVG -->
<svg class="w-5 h-5 flex-shrink-0" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-semibold text-gray-800">Continue with Google</span>
</button>
<!-- Divider: OR -->
<div class="relative flex py-1 items-center justify-center">
<div class="flex-grow border-t border-gray-200"></div>
<span class="flex-shrink mx-3 text-[11px] font-semibold text-gray-400 tracking-wider">OR</span>
<div class="flex-grow border-t border-gray-200"></div>
</div>
<!-- Secondary: Continue with Phone -->
<button class="w-full flex items-center justify-between py-3 px-4 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 active:scale-[0.99] transition-all shadow-sm" type="button">
<div class="flex items-center space-x-3">
<!-- Phone Icon -->
<svg class="w-4 h-4 text-gray-700" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-sm font-medium text-gray-800">Continue with Phone</span>
</div>
<!-- Chevron Right -->
<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Secondary: Continue with Email -->
<button class="w-full flex items-center justify-between py-3 px-4 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 active:scale-[0.99] transition-all shadow-sm" type="button">
<div class="flex items-center space-x-3">
<!-- Mail Icon -->
<svg class="w-4 h-4 text-gray-700" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-sm font-medium text-gray-800">Continue with Email</span>
</div>
<!-- Chevron Right -->
<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- END: ActionButtonsGroup -->
</div>
<!-- BEGIN: LegalFooterDisclaimer -->
<footer class="mt-4 pt-2 text-center safe-bottom" data-purpose="legal-footer">
<p class="text-[11px] leading-relaxed text-gray-500">
          By continuing, you agree to our<br/>
<a class="font-medium text-gray-700 underline decoration-gray-300 underline-offset-2 hover:text-brand-900" href="#">Terms of Service</a> and 
          <a class="font-medium text-gray-700 underline decoration-gray-300 underline-offset-2 hover:text-brand-900" href="#">Privacy Policy</a>
</p>
<!-- Home Bar Indicator -->
<div class="w-32 h-1 bg-gray-900/20 rounded-full mx-auto mt-4 mb-1"></div>
</footer>
<!-- END: LegalFooterDisclaimer -->
</main>
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
