services:
  postgres:
    image: postgres:18
    container_name: scheme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: scheme_db
      POSTGRES_USER: scheme_user
      POSTGRES_PASSWORD: scheme_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  minio:
    image: minio/minio:latest
    container_name: scheme-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-createbuckets:
    image: minio/mc:latest
    container_name: scheme-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/scheme-documents --ignore-existing;
      /usr/bin/mc anonymous set download myminio/scheme-documents;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data: