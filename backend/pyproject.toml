[project]
name = "scheme-backend"
version = "0.1.0"
description = "FastAPI backend for Scheme Management & Eligibility"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "bcrypt>=4.2.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.68",
    "cloudinary>=1.46.2",
    "email-validator>=2.0.0",
    "fastapi>=0.141.1",
    "frictionless>=5.19.0",
    "groq>=1.7.0",
    "langchain-core>=1.6.2",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.11",
    "langsmith>=0.12.2",
    "moto>=5.2.2",
    "playwright>=1.62.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.9.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
    "valkey[hiredis]>=6.0.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/modules", "tests"]
markers = [
    "eval: LLM evaluation tests making external API calls (run explicitly with: pytest -m eval)",
]
addopts = "-m 'not eval'"
